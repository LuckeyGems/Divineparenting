<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divine Parenting & Super Kids Academy</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        html { scroll-behavior: smooth; }
        .hero-bg { 
            background: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.8)), 
            url('https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=2070'); 
            background-size: cover; background-position: center; 
        }
    </style>
</head>
<body x-data="parentingApp()" class="bg-slate-50 font-sans text-slate-800">

    <nav :class="scrolled ? 'bg-white shadow-md py-2' : 'bg-transparent py-4'" class="fixed w-full z-50 transition-all duration-300">
        <div class="container mx-auto px-6 flex justify-between items-center">
            <div class="flex items-center gap-2 font-bold text-xl cursor-pointer" @click="window.scrollTo(0,0)">
                <div class="w-10 h-10 bg-amber-500 rounded-full flex items-center justify-center text-white shadow-lg">D</div>
                <span :class="scrolled ? 'text-slate-800' : 'text-white'">Divine Parenting</span>
            </div>
            
            <div class="flex items-center gap-4">
                <select x-model="lang" class="bg-white border border-amber-500 rounded px-2 py-1 text-sm font-bold outline-none">
                    <option value="en">English</option>
                    <option value="te">తెలుగు</option>
                    <option value="kn">ಕನ್ನಡ</option>
                    <option value="hi">हिंदी</option>
                    <option value="ta">தமிழ்</option>
                </select>
            </div>
        </div>
    </nav>

    <section class="h-screen hero-bg flex items-center justify-center text-center text-white px-6">
        <div class="max-w-4xl">
            <h1 class="text-5xl md:text-7xl font-bold mb-4" x-text="t().hero.title_1"></h1>
            <h2 class="text-4xl md:text-6xl text-amber-400 font-bold mb-8" x-text="t().hero.title_2"></h2>
            <p class="max-w-xl mx-auto mb-10 text-slate-200 text-lg" x-text="t().hero.subtitle"></p>
            <a href="#programs" class="bg-amber-500 px-10 py-4 rounded-full font-bold text-lg hover:bg-amber-600 transition-all inline-block" x-text="t().hero.cta_primary"></a>
        </div>
    </section>

    <section id="programs" class="py-24 bg-slate-100 text-center">
        <div class="container mx-auto px-6">
            <h2 class="text-4xl font-bold mb-4" x-text="t().programs.title"></h2>
            <p class="text-slate-600 mb-16" x-text="t().programs.subtitle"></p>
            
            <div class="grid md:grid-cols-3 gap-8">
                <template x-for="(program, index) in t().programs.items" :key="index">
                    <div class="bg-white p-8 rounded-2xl shadow-lg border-t-8 border-amber-500 hover:-translate-y-2 transition-transform">
                        <h3 class="text-2xl font-bold mb-2" x-text="program.title"></h3>
                        <p class="text-amber-600 font-bold text-xs uppercase mb-4" x-text="program.subtitle"></p>
                        <p class="text-slate-600 mb-6" x-text="program.desc"></p>
                        <ul class="text-left space-y-2 text-sm border-t pt-4">
                            <template x-for="feat in program.features">
                                <li class="flex items-center gap-2">
                                    <span class="w-1.5 h-1.5 bg-amber-500 rounded-full"></span>
                                    <span x-text="feat"></span>
                                </li>
                            </template>
                        </ul>
                    </div>
                </template>
            </div>
        </div>
    </section>

    <section class="py-24 container mx-auto px-6 text-center">
        <h2 class="text-4xl font-bold mb-12" x-text="t().testimonials.title"></h2>
        <div class="grid md:grid-cols-3 gap-8">
            <template x-for="item in t().testimonials.items">
                <div class="bg-white p-8 rounded-2xl shadow-md italic border border-slate-100">
                    <p class="mb-6 text-slate-700" x-text="'&ldquo;' + item.text + '&rdquo;'"></p>
                    <p class="font-bold text-slate-900" x-text="item.author"></p>
                    <p class="text-xs text-slate-400 uppercase" x-text="item.loc"></p>
                </div>
            </template>
        </div>
    </section>

    <section id="contact" class="py-24 bg-slate-900 text-white">
        <div class="container mx-auto px-6 grid md:grid-cols-2 gap-12">
            <div>
                <h2 class="text-4xl font-bold mb-6" x-text="t().contact.title"></h2>
                <p class="text-slate-400 mb-8" x-text="t().contact.subtitle"></p>
                <div class="space-y-4">
                    <p>📍 Vizag Pyramid Center, AP</p>
                    <p>📞 +91 8008117037</p>
                    <p>✉️ Divineparenting@gmail.com</p>
                </div>
            </div>
            <div class="bg-white p-8 rounded-2xl text-slate-800">
                <form @submit.prevent="alert('Thank you! Message received.')">
                    <div class="space-y-4">
                        <input type="text" :placeholder="t().contact.form.name" class="w-full p-3 border rounded-lg">
                        <input type="email" :placeholder="t().contact.form.email" class="w-full p-3 border rounded-lg">
                        <textarea :placeholder="t().contact.form.message" rows="4" class="w-full p-3 border rounded-lg"></textarea>
                        <button class="w-full bg-amber-500 text-white font-bold py-4 rounded-lg hover:bg-amber-600 transition-colors" x-text="t().contact.form.submit"></button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <footer class="bg-slate-950 text-slate-500 py-10 text-center text-sm">
        <p>© 2026 Divine Parenting Academy. Inspired by Vizag Pyramid Spiritual Society.</p>
    </footer>

    <script>
        function parentingApp() {
            return {
                lang: 'en',
                scrolled: false,
                init() {
                    window.addEventListener('scroll', () => {
                        this.scrolled = window.scrollY > 50;
                    });
                },
                t() {
                    return this.translations[this.lang];
                },
                translations: {
                    en: {
                        hero: { title_1: "Today's Children are", title_2: "Tomorrow's Citizens", subtitle: "Raise 'Super Kids'—physically strong and spiritually awakened.", cta_primary: "Explore Programs" },
                        programs: { title: "Our Curriculum", subtitle: "Transformative stages for growth.", items: [
                            { title: "Spiritual Motherhood", subtitle: "Prenatal", desc: "Divine environment for the unborn.", features: ["Garbha Sanskar", "Satvic Diet"] },
                            { title: "Infant Siddha", subtitle: "0-12 Months", desc: "Brain cell stimulation.", features: ["Flashcards", "Swimming from 15 days"] },
                            { title: "Super Kids", subtitle: "1-4 Years", desc: "Intellect and creativity.", features: ["Encyclopedia", "Nature connection"] }
                        ]},
                        testimonials: { title: "Success Stories", items: [
                            { text: "My baby started walking in 15 days!", author: "S. Rajeshwari", loc: "Dubai" },
                            { text: "She reads on her own now.", author: "K. Santoshi", loc: "Vizag" }
                        ]},
                        contact: { title: "Contact Us", subtitle: "Have questions?", form: { name: "Name", email: "Email", message: "Message", submit: "Send" } }
                    },
                    te: {
                        hero: { title_1: "నేటి బాలలే", title_2: "రేపటి పౌరులు", subtitle: "శారీరకంగా మరియు ఆధ్యాత్మికంగా దృఢమైన పిల్లలను పెంచండి.", cta_primary: "కార్యక్రమాలు" },
                        programs: { title: "మా పాఠ్య ప్రణాళిక", subtitle: "అభివృద్ధికి మార్గదర్శకాలు.", items: [
                            { title: "ధ్యాన మాతృత్వం", subtitle: "గర్భస్థ సంరక్షణ", desc: "పుట్టబోయే బిడ్డకు దివ్యమైన వాతావరణం.", features: ["గర్భ సంస్కారం", "సాత్విక ఆహారం"] },
                            { title: "శిశు సిద్ధ కార్యక్రమం", subtitle: "0-12 నెలలు", desc: "మెదడు కణాల ప్రేరణ.", features: ["ఫ్లాష్‌కార్డులు", "15 రోజుల నుండి ఈత"] },
                            { title: "సూపర్ కిడ్స్", subtitle: "1-4 సంవత్సరాలు", desc: "మేధస్సు మరియు సృజనాత్మకత.", features: ["ఎన్సైక్లోపీడియా", "ప్రకృతి అనుసంధానం"] }
                        ]},
                        testimonials: { title: "విజయ గాథలు", items: [
                            { text: "నా బిడ్డ 15 రోజుల్లో నడవడం ప్రారంభించింది!", author: "S. రాజేశ్వరి", loc: "దుబాయ్" },
                            { text: "ఆమె ఇప్పుడు సొంతంగా చదువుతోంది.", author: "K. సంతోషి", loc: "విశాఖపట్నం" }
                        ]},
                        contact: { title: "సంప్రదించండి", subtitle: "ప్రశ్నలు ఉన్నాయా?", form: { name: "పేరు", email: "ఇమెయిల్", message: "సందేశం", submit: "పంపండి" } }
                    },
                    kn: {
                        hero: { title_1: "ಇಂದಿನ ಮಕ್ಕಳು", title_2: "ನಾಳೆಯ ಪ್ರಜೆಗಳು", subtitle: "ದೈಹಿಕವಾಗಿ ಮತ್ತು ಆಧ್ಯಾತ್ಮಿಕವಾಗಿ ಸದೃಢರಾದ ಮಕ್ಕಳನ್ನು ಬೆಳೆಸಿ.", cta_primary: "ಕಾರ್ಯಕ್ರಮಗಳು" },
                        programs: { title: "ನಮ್ಮ ಪಠ್ಯಕ್ರಮ", subtitle: "ಬೆಳವಣಿಗೆಯ ಹಂತಗಳು.", items: [
                            { title: "ಆಧ್ಯಾತ್ಮಿಕ ಮಾತೃತ್ವ", subtitle: "ಪ್ರಸವಪೂರ್ವ", desc: "ಹುಟ್ಟಲಿರುವ ಮಗುವಿಗೆ ದೈವಿಕ ಪರಿಸರ.", features: ["ಗರ್ಭ ಸಂಸ್ಕಾರ", "ಸಾತ್ವಿಕ ಆಹಾರ"] },
                            { title: "ಶಿಶು ಸಿದ್ಧ ಕಾರ್ಯಕ್ರಮ", subtitle: "0-12 ತಿಂಗಳು", desc: "ಮೆದುಳಿನ ಕೋಶಗಳ ಪ್ರಚೋದನೆ.", features: ["ಫ್ಲ್ಯಾಶ್ ಕಾರ್ಡ್‌ಗಳು", "15 ದಿನಗಳಿಂದ ಈಜು"] },
                            { title: "ಸೂಪರ್ ಕಿಡ್ಸ್", subtitle: "1-4 ವರ್ಷಗಳು", desc: "ಬುದ್ಧಿವಂತಿಕೆ ಮತ್ತು ಸೃಜನಶೀಲತೆ.", features: ["ವಿಶ್ವಕೋಶ", "ಪ್ರಕೃತಿಯೊಂದಿಗೆ ಸಂಪರ್ಕ"] }
                        ]},
                        testimonials: { title: "ಯಶಸ್ಸಿನ ಕಥೆಗಳು", items: [
                            { text: "ನನ್ನ ಮಗು 15 ದಿನಗಳಲ್ಲಿ ನಡೆಯಲು ಪ್ರಾರಂಭಿಸಿತು!", author: "ಎಸ್. ರಾಜೇಶ್ವರಿ", loc: "ದುಬೈ" },
                            { text: "ಅವಳು ಈಗ ತನ್ನಷ್ಟಕ್ಕೆ ತಾನೇ ಓದುತ್ತಾಳೆ.", author: "ಕೆ. ಸಂತೋಷಿ", loc: "ವೈಜಾಗ್" }
                        ]},
                        contact: { title: "ನಮ್ಮನ್ನು ಸಂಪರ್ಕಿಸಿ", subtitle: "ಪ್ರಶ್ನೆಗಳಿವೆಯೇ?", form: { name: "ಹೆಸರು", email: "ಇಮೇಲ್", message: "ಸಂದೇಶ", submit: "ಕಳುಹಿಸಿ" } }
                    }
                    // Hindi and Tamil follow same pattern...
                }
            }
        }
    </script>
</body>
</html>
