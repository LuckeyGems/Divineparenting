<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divine Parenting & Super Kids Academy</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        html { scroll-behavior: smooth; }
        .hero-bg { background: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.7)), url('https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=2070'); background-size: cover; background-position: center; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Translation Data
        const TRANSLATIONS = {
            en: {
                title: "Divine Parenting",
                hero: "Today's Children are Tomorrow's Citizens",
                cta: "Explore Programs",
                form: { name: "Name", email: "Email", message: "Message", submit: "Send" }
            },
            te: {
                title: "డివైన్ పేరెంటింగ్",
                hero: "నేటి బాలలే రేపటి పౌరులు",
                cta: "కార్యక్రమాలు చూడండి",
                form: { name: "పేరు", email: "ఇమెయిల్", message: "సందేశం", submit: "పంపండి" }
            }
        };

        // Component: Safe Icon
        const Icon = ({ name }) => {
            const LucideIcon = lucide[name] || lucide.HelpCircle;
            return <LucideIcon size={24} className="inline-block" />;
        };

        // Component: Contact Form (Fixed to prevent "undefined" errors)
        const ContactForm = ({ formText }) => {
            return (
                <div className="bg-white p-6 rounded-xl shadow-lg space-y-4 max-w-md mx-auto">
                    <input className="w-full p-3 border rounded" placeholder={formText?.name || "Name"} />
                    <input className="w-full p-3 border rounded" placeholder={formText?.email || "Email"} />
                    <textarea className="w-full p-3 border rounded" placeholder={formText?.message || "Message"}></textarea>
                    <button className="w-full bg-amber-500 text-white py-3 rounded-lg font-bold">
                        {formText?.submit || "Submit"}
                    </button>
                </div>
            );
        };

        function App() {
            const [lang, setLang] = useState('en');
            const t = TRANSLATIONS[lang];

            return (
                <div className="min-h-screen">
                    {/* Header */}
                    <nav className="p-4 bg-white shadow-sm flex justify-between items-center sticky top-0 z-50">
                        <div className="font-bold text-xl text-amber-600">{t.title}</div>
                        <select 
                            onChange={(e) => setLang(e.target.value)}
                            className="border border-amber-500 rounded px-2 py-1"
                        >
                            <option value="en">English</option>
                            <option value="te">తెలుగు</option>
                        </select>
                    </nav>

                    {/* Hero */}
                    <header className="h-[70vh] hero-bg flex items-center justify-center text-center text-white px-4">
                        <div>
                            <h1 className="text-4xl md:text-6xl font-bold mb-6">{t.hero}</h1>
                            <button className="bg-amber-500 px-8 py-4 rounded-full font-bold text-lg">{t.cta}</button>
                        </div>
                    </header>

                    {/* Content Section */}
                    <section className="py-16 px-6">
                        <div className="text-center mb-12">
                            <h2 className="text-3xl font-bold text-slate-800">Contact Us</h2>
                            <p className="text-slate-500">Reach out to start your journey.</p>
                        </div>
                        {/* Pass the form translation data specifically */}
                        <ContactForm formText={t.form} />
                    </section>

                    <footer className="bg-slate-900 text-slate-500 py-8 text-center">
                        © 2026 Divine Parenting Academy.
                    </footer>
                </div>
            );
        }

        // Final Render
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
