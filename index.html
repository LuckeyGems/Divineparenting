                        lakshmi: { name: "சதரம் லட்சுமி", role: "முதன்மை இயக்குனர்", desc: "சதரம் லட்சுமி 28 ஆண்டுகளுக்கும் மேலான ஆழமான அனுபவமுள்ள ஒரு அர்ப்பணிப்புள்ள ஆன்மீக ஆலோசகர் ஆவார். விசாகப்பட்டினத்தில் உள்ள பிரம்மரிஷி பிரமிட்டிலிருந்து செயல்படும் அவர், சூப்பர் கிட்ஸ் இயக்கத்தை வழிநடத்துவதில் முக்கிய பங்கு வகித்துள்ளார். அவரது நிபுணத்துவம் தெய்வீக குழந்தை வளர்ப்பு, குடும்ப ஆலோசனை மற்றும் தியானக் கல்வி வரை நீண்டுள்ளது." }, 
                        santoshi: { name: "சந்தோஷி லட்சுமி", role: "பெற்றோர் பயிற்சியாளர்", desc: "சந்தோஷி லட்சுமி மிகவும் அனுபவம் வாய்ந்த பெற்றோர் பயிற்சியாளர் மற்றும் ஜீனியஸ் கிட்ஸ் பாலர் பள்ளியின் நிறுவனர் ஆவார். அவர் 28 ஆண்டுகளுக்கும் மேலாக ஆனாபானசதி தியானப் பயிற்சி செய்து வருகிறார். 2008 இல் தனது சொந்த குழந்தைக்கு குழந்தை கல்வி நுட்பங்களை வெற்றிகரமாகப் பயன்படுத்தினார்." },

                        prasanna: { name: "பிரசன்னா லட்சுமி கொண்டூரு", role: "தியான பயிற்சியாளர் மற்றும் ஆலோசகர்", desc: "பிரசன்னா லட்சுமி பி.ஏ (ஈ.பி.பி) பயின்றுள்ளார். தியானப் பயிற்சியில் 20+ ஆண்டுகள் அனுபவம் கொண்டவர். ஒரு சிறந்த தியானப் பயிற்சியாளர், ஊக்கமளிக்கும் பேச்சாளர் மற்றும் குடும்ப ஆலோசகர். மன, உணர்ச்சி மற்றும் ஆன்மீக நல்வாழ்வை நோக்கி வழிகாட்டுவதில் நிபுணத்துவம் பெற்றவர். வெளியீடுகள்: சூப்பர் கிட்ஸ், மாணவர்களின் சிக்கல்களும் தீர்வுகளும், பரிபூர்ண வித்யா, தியான வீட்கோலு." },
                        amulya: { name: "அமுல்யா தேவரகொண்டா", role: "தொழில்நுட்ப ஆதரவாளர் & ஆலோசகர்", desc: "அமுல்யா தேவரகொண்டா இங்கிலாந்தை தளமாகக் கொண்ட ஒரு அர்ப்பணிப்புள்ள நிபுணர். லாஜிஸ்டிக்ஸ் மற்றும் சப்ளை செயின் மேனேஜ்மென்ட்டில் முதுகலை பட்டம் பெற்றவர். தற்போது டிவைன் பேரன்டிங்கில் தொழில்நுட்ப ஆதரவாளராகவும், ஆலோசகராகவும், ஒருங்கிணைப்பாளராகவும் பணிபுரிகிறார்." },

                return () => {
                    clearInterval(bgTimer);
                    clearInterval(guruTimer);
                };
            }, [t.firstGuru.points.length]);

            // --- FETCH LOCAL EVENTS ---
            useEffect(() => {
                const fetchLocalEvents = async () => {
                    try {
                        const response = await fetch('assets/data/events.json');
                        const data = await response.json();
                        
                        if (data.feed && data.feed.entry) {
                            const formattedEvents = data.feed.entry.map(entry => {
                                const publishedDate = new Date(entry.published.$t);
                                let imageUrl = entry.media$thumbnail ? entry.media$thumbnail.url.replace('/s72-c/', '/s600/') : null;
                                if (!imageUrl && entry.content && entry.content.$t) {
                                     const imgMatch = entry.content.$t.match(/src="([^"]+)"/);
                                     if (imgMatch) imageUrl = imgMatch[1];
                                }
                                return {
                                    title: entry.title.$t,
                                    content: entry.content.$t,
                                    published: entry.published.$t,
                                    day: publishedDate.getDate().toString().padStart(2, '0'),
                                    month: publishedDate.toLocaleString('default', { month: 'short' }).toUpperCase(),
                                    dateValue: entry.published.$t.split('T')[0],
                                    loc: 'Divine Parenting Center', 
                                    time: '10:00 AM',
                                    image: imageUrl
                                };
                            });
                            setBlogEvents(formattedEvents);

                                                    onError={(e) => { e.target.onerror = null; e.target.src = `https://img.youtube.com/vi/${short.videoId}/hqdefault.jpg`; }} 
                                                    alt="Short Thumbnail" 
                                                    className="w-full h-full object-cover opacity-80 group-hover/short:scale-105 transition-transform duration-500"
                                                />
                                                <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent flex flex-col justify-end p-6">
                                                    <div className="w-10 h-10 bg-red-600 rounded-full flex items-center justify-center mb-4 shadow-lg group-hover/short:scale-110 transition-transform">
                                                        <svg className="w-4 h-4 text-white ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                                    </div>
                                                    <h4 className="text-white font-bold line-clamp-2 leading-tight">{short.title}</h4>
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    {/* Right Scroll Button (Desktop only) */}
                                    <button onClick={() => scrollShorts('right')} className="hidden md:flex absolute right-0 top-[40%] -translate-y-1/2 translate-x-4 z-10 bg-white shadow-xl rounded-full p-3 text-slate-800 hover:text-amber-500 hover:scale-110 transition-all border border-slate-200 opacity-0 group-hover:opacity-100 focus:opacity-100">
                                        <ChevronRight size={24} />
                                    </button>
                                </div>
                            </div>
                        </div>
                    </section>
                    
                    {/* --- MENTORS SECTION --- */}
                    <section id="mentors" className="py-24 bg-white border-t border-slate-100">
                        <div className="container mx-auto px-4">
                            <SectionTitle title={t.mentors.title} subtitle={t.mentors.subtitle} />
                            
                            {/* Founders / Main Guides */}
                            <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-8 mb-16">
                                {mainMentors.map((mentorData, i) => {
                                    const mentorInfo = t.mentors.items[mentorData.id] || {};
                                    if(!mentorInfo.name) return null; 
                                    return (
                                        <div 
                                            key={mentorData.id} 
                                            onClick={() => setSelectedMentor({ ...mentorInfo, ...mentorData })}
                                            className="mentor-card relative group bg-slate-50 rounded-2xl overflow-hidden shadow-lg hover:shadow-xl transition-all hover:-translate-y-2 cursor-pointer border border-amber-200"
                                        >
                                            <div className="h-96 overflow-hidden bg-slate-200">
                                                <img 
                                                    src={mentorData.image} 
                                                    onError={(e) => { e.target.style.display = 'none'; }}
                                                    alt={mentorInfo.name} 
                                                    className="w-full h-full object-cover transition-transform duration-700 mentor-image object-top" 
                                                />
                                            </div>
                                            
                                            <div className="absolute inset-0 bg-black/0 group-hover:bg-black/20 transition-all flex items-center justify-center">
                                                <span className="opacity-0 group-hover:opacity-100 bg-white/95 px-6 py-2 rounded-full text-sm font-bold text-slate-800 shadow-lg transform translate-y-4 group-hover:translate-y-0 transition-all duration-300">View Profile</span>
                                            </div>

                                            <div className="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-slate-900 via-slate-900/80 to-transparent p-6 pt-20">
                                                <h3 className="text-xl font-bold text-white mb-1">{mentorInfo.name}</h3>
                                                <p className="text-amber-400 font-medium text-sm uppercase tracking-wider">{mentorInfo.role}</p>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                            <div className="text-center mb-12">
                                <h3 className="text-2xl font-serif font-bold text-slate-700">{t.mentors.titleTrustees || "Trustees & Counselors"}</h3>
                                <div className="h-1 w-16 bg-amber-400 mx-auto mt-4 rounded-full"></div>
                            </div>

                            {/* Trustees and Others */}
                            <div className="grid md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
                                {trustees.map((mentorData, i) => {
                                    const mentorInfo = t.mentors.items[mentorData.id] || {};
                                    if(!mentorInfo.name) return null; 
                                    return (
                                        <div 
                                            key={mentorData.id} 
                                            onClick={() => setSelectedMentor({ ...mentorInfo, ...mentorData })}
                                            className="mentor-card relative group bg-slate-50 rounded-2xl overflow-hidden shadow hover:shadow-xl transition-all hover:-translate-y-2 cursor-pointer border border-slate-100"
                                        >
                                            <div className="h-80 overflow-hidden bg-slate-200">
                                                <img 
                                                    src={mentorData.image} 
                                                    onError={(e) => { e.target.style.display = 'none'; }}
                                                    alt={mentorInfo.name} 
                                                    className="w-full h-full object-cover transition-transform duration-700 mentor-image object-top" 
                                                />
                                            </div>
                                            
                                            <div className="absolute inset-0 bg-black/0 group-hover:bg-black/20 transition-all flex items-center justify-center">
                                                <span className="opacity-0 group-hover:opacity-100 bg-white/95 px-6 py-2 rounded-full text-sm font-bold text-slate-800 shadow-lg transform translate-y-4 group-hover:translate-y-0 transition-all duration-300">View Profile</span>
                                            </div>

                                            <div className="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-slate-900 via-slate-900/80 to-transparent p-6 pt-20">
                                                <h3 className="text-lg font-bold text-white mb-1">{mentorInfo.name}</h3>
                                                <p className="text-amber-400 font-medium text-xs uppercase tracking-wider">{mentorInfo.role}</p>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                            {/* --- TEACHERS MARQUEE (BELOW TRUSTEES) --- */}
                            <div className="mt-20 pt-16 border-t border-slate-100 overflow-hidden relative">
                                <h3 className="text-2xl font-serif font-bold text-slate-700 text-center mb-8">{t.mentors.teachersTitle || "Teachers & Special Guidance"}</h3>
                                <div className="text-marquee-container flex gap-12 text-slate-600 font-semibold text-lg items-center px-4">
                                    {TEACHERS_LIST.map((teacher, idx) => (
                                        <React.Fragment key={idx}>
                                            <span className="flex items-center gap-2 text-slate-800">
                                                <Star className="text-amber-400 w-4 h-4" /> {teacher}
                                            </span>
                                            {idx < TEACHERS_LIST.length - 1 && <span className="text-slate-300">•</span>}
                                        </React.Fragment>
                                    ))}
                                    {/* Duplicate for infinite loop effect */}
                                    <span className="text-slate-300">•</span>
                                    {TEACHERS_LIST.map((teacher, idx) => (
                                        <React.Fragment key={`dup-${idx}`}>
                                            <span className="flex items-center gap-2 text-slate-800">
                                                <Star className="text-amber-400 w-4 h-4" /> {teacher}
                                            </span>
                                            {idx < TEACHERS_LIST.length - 1 && <span className="text-slate-300">•</span>}
                                        </React.Fragment>
                                    ))}
                                </div>
                            </div>

                        </div>
                    </section>

                    <section id="contact" className="py-24 bg-slate-50 border-t border-slate-100">
                        <div className="container mx-auto px-4 grid lg:grid-cols-2 gap-12">
                            <div>
                                <SectionTitle title={t.contact.title} subtitle={t.contact.subtitle} centered={false} />
                                <div className="space-y-6 mt-8">
                                    <div className="flex gap-4 items-center p-6 bg-white rounded-xl shadow-sm border border-slate-100"><MapPin className="text-amber-500"/><div><h4 className="font-bold">Vizag Center</h4><p className="text-slate-500">Main Campus, Andhra Pradesh</p></div></div>
                                    <div className="flex gap-4 items-center p-6 bg-white rounded-xl shadow-sm border border-slate-100"><Phone className="text-amber-500"/><div><h4 className="font-bold">Phone</h4><p className="text-slate-500">+91 8008117037</p></div></div>
                                    <div className="flex gap-4 items-center p-6 bg-white rounded-xl shadow-sm border border-slate-100"><Mail className="text-amber-500"/><div><h4 className="font-bold">Email</h4><p className="text-slate-500">slakshmipyramid@gmail.com</p></div></div>
                                </div>
                            </div>
                            <div className="h-full"><CustomForm type="contact" formLabels={t.formLabels || TRANSLATIONS.en.formLabels} /></div>
                        </div>
                    </section>

                    {/* --- BALI PROMO SECTION (MOVED TO BOTTOM BEFORE FOOTER) --- */}
                    {SHOW_BALI_PROMO && (
                        <section className="relative py-20 overflow-hidden bg-slate-900 border-t border-b-4 border-amber-500">
                            <div className="absolute inset-0 z-0">
                                <img src="https://images.unsplash.com/photo-1518548419970-58e3b4079ab2?q=80&w=2070&auto=format&fit=crop" className="w-full h-full object-cover opacity-40" alt="Bali Theme" />
                                <div className="absolute inset-0 bg-gradient-to-b from-slate-900/90 via-slate-900/60 to-slate-900/90"></div>
                            </div>
                            
                            <div className="container mx-auto px-4 relative z-10">
                                <div className="text-center mb-12">
                                    <h2 className="text-3xl md:text-5xl font-serif font-bold text-amber-400 mb-4 drop-shadow-lg">{t.promo?.title}</h2>
                                    <p className="text-lg text-slate-200 max-w-2xl mx-auto">{t.promo?.subtitle}</p>
                                </div>
                                
                                <div className="flex flex-col md:flex-row justify-center items-center gap-8 md:gap-16">
                                    {/* WhatsApp Card */}
                                    <div className="bg-white/10 backdrop-blur-md p-8 rounded-3xl border border-white/20 text-center w-full max-w-sm hover:bg-white/20 transition-all duration-300 shadow-2xl">
                                        <div className="w-16 h-16 mx-auto bg-green-500 rounded-full flex items-center justify-center mb-6 shadow-lg shadow-green-500/30">
                                            <svg className="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 24 24"><path fillRule="evenodd" clipRule="evenodd" d="M12.01 2.011a10.007 10.007 0 00-8.528 15.263l-1.47 5.372 5.5-1.445a10.01 10.01 0 104.498-19.19zm0 18.212a8.2 8.2 0 01-4.185-1.144l-.3-.178-3.08.81.824-3.003-.195-.311A8.217 8.217 0 1112.01 20.223zm4.502-6.155c-.246-.124-1.46-.723-1.687-.806-.226-.082-.392-.124-.555.124-.165.247-.638.806-.782.971-.144.164-.288.185-.535.061-.246-.124-1.042-.383-1.986-1.229-.734-.658-1.23-1.471-1.374-1.718-.144-.247-.015-.38.108-.503.111-.112.247-.289.37-.433.123-.144.164-.247.247-.412.082-.165.041-.309-.021-.433-.061-.124-.555-1.339-.76-1.834-.2-.482-.403-.416-.554-.424-.145-.007-.311-.007-.476-.007a.91.91 0 00-.66.309c-.226.247-.864.845-.864 2.06 0 1.216.886 2.39 1.009 2.555.124.164 1.743 2.658 4.223 3.727.59.255 1.05.408 1.408.522.593.189 1.134.162 1.558.098.473-.07 1.46-.597 1.665-1.174.206-.576.206-1.07.144-1.174-.061-.102-.226-.164-.473-.288z"></path></svg>
                                        </div>
                                        <h3 className="text-2xl font-bold text-white mb-2">{t.promo?.whatsapp}</h3>
                                        <p className="text-slate-300 text-sm mb-6">{t.promo?.scanText}</p>
                                        
                                        <div className="bg-white p-3 rounded-2xl inline-block mb-6 shadow-inner">
                                            <img src={`https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(BALI_PROMO_LINKS.whatsapp)}`} alt="WhatsApp QR" className="w-32 h-32" />
                                        </div>
                                        
                                        <a href={BALI_PROMO_LINKS.whatsapp} target="_blank" className="block w-full py-3 bg-green-500 hover:bg-green-600 text-white font-bold rounded-xl transition-colors shadow-lg text-lg">
                                            {t.promo?.clickText}
                                        </a>
                                    </div>

                                    {/* Feedback Form Card */}
                                    <div className="bg-white/10 backdrop-blur-md p-8 rounded-3xl border border-white/20 text-center w-full max-w-sm hover:bg-white/20 transition-all duration-300 shadow-2xl">
                                        <div className="w-16 h-16 mx-auto bg-blue-500 rounded-full flex items-center justify-center mb-6 shadow-lg shadow-blue-500/30">
                                            <FileText className="w-8 h-8 text-white" />
                                        </div>
                                        <h3 className="text-2xl font-bold text-white mb-2">{t.promo?.feedback}</h3>
                                        <p className="text-slate-300 text-sm mb-6">{t.promo?.scanText}</p>
                                        
                                        <div className="bg-white p-3 rounded-2xl inline-block mb-6 shadow-inner">
                                            <img src={`https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(BALI_PROMO_LINKS.feedback)}`} alt="Feedback QR" className="w-32 h-32" />
                                        </div>
                                        
                                        <a href={BALI_PROMO_LINKS.feedback} target="_blank" className="block w-full py-3 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-xl transition-colors shadow-lg text-lg">
                                            {t.promo?.clickText}
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </section>
                    )}

                    <footer className="bg-slate-900 text-slate-400 py-12 text-center border-t border-slate-800">
                        <p>© 2026 Divine Parenting Academy. All rights reserved.</p>
                    </footer>

                    <EventDetailsModal event={selectedEventDetails} onClose={() => setSelectedEventDetails(null)} onRegister={setRegistrationEvent} t={t.events} />
                    <EventGalleryModal galleries={EVENT_GALLERIES} selectedIndex={selectedGalleryIndex} onClose={() => setSelectedGalleryIndex(null)} onSelectGallery={setSelectedGalleryIndex} t={t.eventGallery || TRANSLATIONS.en.eventGallery} />
                    <MentorModal mentor={selectedMentor} onClose={() => setSelectedMentor(null)} />
                    <VideoModal videoId={selectedVideo} onClose={() => setSelectedVideo(null)} />
                    <CustomForm type="register" isOpen={!!registrationEvent} prefillData={registrationEvent || {}} onClose={() => setRegistrationEvent(null)} formLabels={t.formLabels || TRANSLATIONS.en.formLabels} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
