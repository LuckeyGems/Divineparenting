            };

            const handleReset = () => {
                setSubmitted(false);
                setIsLoading(false);
                setFormKey(p => p + 1);
                if (type === 'register') onClose();
            };

            // Parse Date String (YYYY-MM-DD) into components
            const parseDate = (dateStr) => {
                if(!dateStr) return { y: '', m: '', d: '' };
                const [y, m, d] = dateStr.split('-');
                return { y, m, d };
            };

            const eventDateParts = type === 'register' ? parseDate(prefillData.dateValue) : {y: yyyy, m: mm, d: dd};
            const eventEndDateParts = eventDateParts; 

            const FormLayout = () => (
                <div className={`bg-white rounded-2xl ${type === 'register' ? '' : 'shadow-xl border border-slate-100'} overflow-hidden h-full flex flex-col`}>
                    {type === 'register' && (
                        <div className="flex justify-between items-center p-6 border-b border-slate-100 bg-slate-50">
                            <div><h3 className="text-xl font-bold text-slate-900">Event Registration</h3><p className="text-sm text-slate-500">Secure your spot for this session</p></div>
                            <button onClick={onClose} className="p-2 hover:bg-slate-200 rounded-full"><XCircle size={24} className="text-slate-500" /></button>
                        </div>
                    )}

                    <div className="p-6 md:p-8 flex-1 overflow-y-auto">
                        {submitted ? (
                            <div className="h-full flex flex-col items-center justify-center text-center py-12 fade-in">
                                <div className="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center text-green-600 mb-6 animate-bounce"><CheckCircle size={40} /></div>
                                <h3 className="text-2xl font-bold text-slate-900 mb-2">Success!</h3>
                                <p className="text-slate-600 max-w-sm mx-auto mb-8">We have received your details.</p>
                                <button onClick={handleReset} className="px-8 py-3 bg-slate-900 text-white rounded-xl font-bold">Close</button>
                            </div>
                        ) : (
                            <form key={formKey} action={FORM_CONFIG.formActionUrl} method="POST" target="hidden_iframe" onSubmit={handleSubmit} className={`space-y-6 ${isLoading ? 'opacity-50' : ''}`}>
                                
                                {type === 'register' && (
                                    <div className="bg-amber-50 rounded-xl p-6 border border-amber-100 space-y-4">
                                        <div><label className="block text-xs font-bold text-slate-500">Event</label>
                                        <input type="text" name={FORM_CONFIG.fields.eventName} value={prefillData.title || ''} readOnly className="w-full bg-transparent border-b border-amber-200 font-bold"/></div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div><label className="block text-xs font-bold text-slate-500">Date</label>
                                            <input type="text" value={`${prefillData.day} ${prefillData.month}`} readOnly className="w-full bg-transparent border-b border-amber-200 font-medium"/></div>
                                            <div><label className="block text-xs font-bold text-slate-500">Time</label>
                                            <input type="text" value={prefillData.time || '10:00'} readOnly className="w-full bg-transparent border-b border-amber-200 font-medium"/></div>
                                        </div>
                                    </div>
                                )}

                                {/* --- HIDDEN GOOGLE FORM DATE SPLIT FIELDS (CRITICAL) --- */}
                                {/* Start Date */}
                                <input type="hidden" name={FORM_CONFIG.fields.eventStartDate + "_year"} value={eventDateParts.y} />
                                <input type="hidden" name={FORM_CONFIG.fields.eventStartDate + "_month"} value={eventDateParts.m} />
                                <input type="hidden" name={FORM_CONFIG.fields.eventStartDate + "_day"} value={eventDateParts.d} />
                                
                                {/* End Date */}
                                <input type="hidden" name={FORM_CONFIG.fields.eventEndDate + "_year"} value={eventEndDateParts.y} />
                                <input type="hidden" name={FORM_CONFIG.fields.eventEndDate + "_month"} value={eventEndDateParts.m} />
                                <input type="hidden" name={FORM_CONFIG.fields.eventEndDate + "_day"} value={eventEndDateParts.d} />

                                {type === 'contact' && (
                                    <>
                                        <input type="hidden" name={FORM_CONFIG.fields.eventName} value="General Inquiry" />
                                    </>
                                )}
                                
                                {/* EXACT CASE MATCH for Reference Field */}
                                <input type="hidden" name={FORM_CONFIG.fields.reference} value={type === 'register' ? 'Event Page' : 'Contact page'} />
                                {/* SENTINEL FIELD */}
                                <input type="hidden" name={FORM_CONFIG.fields.reference + "_sentinel"} value="" />

                                <div className="space-y-4">
                                    <div><label className="block text-sm font-medium text-slate-700">Name *</label>
                                    <input required name={FORM_CONFIG.fields.name} type="text" className="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-amber-500 outline-none" placeholder="Full Name" /></div>
                                    
                                    <div className="grid md:grid-cols-2 gap-4">
                                        <div><label className="block text-sm font-medium text-slate-700">Phone *</label>
                                        <input required name={FORM_CONFIG.fields.phone} type="tel" className="w-full px-4 py-3 rounded-lg border border-slate-300 outline-none" placeholder="+91..." /></div>
                                        <div><label className="block text-sm font-medium text-slate-700">Email *</label>
                                        <input required name={FORM_CONFIG.fields.email} type="email" className="w-full px-4 py-3 rounded-lg border border-slate-300 outline-none" placeholder="Email" /></div>
                                    </div>
                                    
                                    <div><label className="block text-sm font-medium text-slate-700">Message *</label>
                                    <textarea required name={FORM_CONFIG.fields.message} rows="3" className="w-full px-4 py-3 rounded-lg border border-slate-300 outline-none" placeholder="Your message..."></textarea></div>
                                </div>

                                <button type="submit" disabled={isLoading} className="w-full py-4 bg-amber-500 hover:bg-amber-600 text-white rounded-xl font-bold text-lg flex items-center justify-center gap-2">
                                    {isLoading ? <Loader2 className="animate-spin" /> : <Send size={20} />}
                                    <span>{isLoading ? 'Sending...' : (type === 'register' ? 'Confirm Registration' : 'Send Message')}</span>
                                </button>
                            </form>
                        )}
                    </div>
                    <iframe name="hidden_iframe" id="hidden_iframe" style={{display:'none'}} ref={iframeRef}></iframe>
                </div>
            );

            if (type === 'register') {
                return (
                    <div className="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm fade-in" onClick={onClose}>
                        <div className="w-full max-w-lg h-auto max-h-[90vh] flex flex-col shadow-2xl rounded-2xl" onClick={e => e.stopPropagation()}>
                            <FormLayout />
                        </div>
                    </div>
                );
            }
            return <FormLayout />;
        };

        // --- MAIN APP ---

        function App() {
            const [lang, setLang] = useState('en');
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [scrolled, setScrolled] = useState(false);
            const [blogEvents, setBlogEvents] = useState([]);
            const [selectedPost, setSelectedPost] = useState(null);
            const [registrationEvent, setRegistrationEvent] = useState(null);
            const [selectedMentor, setSelectedMentor] = useState(null); // STATE FOR MENTOR MODAL
            const [langMenuOpen, setLangMenuOpen] = useState(false);
            
            const t = useMemo(() => TRANSLATIONS[lang] || TRANSLATIONS.en, [lang]);

            useEffect(() => {
                setBlogEvents(t.events.items);
            }, [t]);

            useEffect(() => {
                const detectLanguage = async () => {
                try {
                    const response = await fetch('https://ipapi.co/json/');
                    const data = await response.json();
                    if (data && data.country_code === 'IN') {
                        const region = data.region_code;
                        if (region === 'AP' || region === 'TG') setLang('te');
                        else if (region === 'TN') setLang('ta');
                        else if (['DL', 'UP', 'MP', 'RJ', 'HR'].includes(region)) setLang('hi');
                        else if (region === 'KL') setLang('ml'); // Malayalam for Kerala
                        else if (region === 'KA') setLang('kn'); // Kannada for Karnataka
                    }
                } catch (e) { console.log('Lang default: en'); }
                };
                detectLanguage();

                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const scrollToSection = (id) => {
                const el = document.getElementById(id);
                if (el) { setIsMenuOpen(false); el.scrollIntoView({ behavior: 'smooth' }); }
            };

            const LANGUAGES = [
                { code: 'en', name: 'English', label: 'English' },
                { code: 'te', name: 'Telugu', label: 'తెలుగు' },
                { code: 'hi', name: 'Hindi', label: 'हिंदी' },
                { code: 'ta', name: 'Tamil', label: 'தமிழ்' },
                { code: 'ml', name: 'Malayalam', label: 'മലയാളം' },
                { code: 'kn', name: 'Kannada', label: 'ಕನ್ನಡ' }
            ];

            return (
                <div className="min-h-screen bg-slate-50 font-sans text-slate-800">
                    <nav className={`fixed w-full z-50 transition-all duration-300 ${scrolled ? 'bg-white/95 backdrop-blur-sm shadow-md py-2' : 'bg-slate-900/10 py-4'}`}>
                        <div className="container mx-auto px-4 flex justify-between items-center">
                            <div className="flex items-center gap-2 font-serif text-2xl font-bold cursor-pointer" onClick={() => scrollToSection('home')}>
                                <div className="w-10 h-10 bg-amber-500 rounded-full flex items-center justify-center text-white text-xl">D</div>
                                <span className={scrolled ? 'text-slate-800' : 'text-white'}>Divine<span className="text-amber-500">Parenting</span></span>
                            </div>
                            <div className="hidden lg:flex gap-8 items-center">
                                {/* Exclude 'contact' from the mapped links to avoid duplicate */}
                                {Object.keys(t.nav).filter(k => k !== 'contact').map(key => (
                                    <button key={key} onClick={() => scrollToSection(key)} className={`text-sm font-medium hover:text-amber-500 uppercase ${scrolled ? 'text-slate-600' : 'text-slate-100'}`}>{t.nav[key]}</button>
                                ))}

                                <div className="relative">
                                    <button onClick={() => setLangMenuOpen(!langMenuOpen)}
                                        className={`flex items-center gap-2 px-3 py-1.5 rounded-full border ${scrolled ? 'border-slate-200 text-slate-700 bg-slate-50' : 'border-white/30 text-white bg-white/10 hover:bg-white/20'}`}>
                                        <Globe size={16} /><span className="text-sm font-medium uppercase">{lang}</span>
                                    </button>
                                    
                                    {langMenuOpen && (
                                        <div className="absolute top-full right-0 mt-2 w-48 bg-white rounded-xl shadow-xl border border-slate-100 py-2 overflow-hidden animate-in fade-in zoom-in-95">
                                        <div className="px-4 py-2 bg-slate-50 text-xs font-bold text-slate-400 uppercase">Select Language</div>
                                        {LANGUAGES.map((l) => (
                                            <button key={l.code} onClick={() => { setLang(l.code); setLangMenuOpen(false); }}
                                            className={`w-full text-left px-4 py-2 text-sm hover:bg-amber-50 hover:text-amber-600 flex justify-between ${lang === l.code ? 'text-amber-600 font-bold' : 'text-slate-600'}`}>
                                            <span>{l.name}</span><span className="text-xs text-slate-400">{l.label}</span>
                                            </button>
                                        ))}
                                        </div>
                                    )}
                                </div>

                                <button onClick={() => scrollToSection('contact')} className="bg-amber-500 text-white px-5 py-2 rounded-full font-bold text-sm hover:bg-amber-600">Contact</button>
                            </div>
                            <div className="flex lg:hidden items-center gap-4">
                                <button onClick={() => setLangMenuOpen(!langMenuOpen)} className={`px-2 py-1 rounded border text-xs font-bold uppercase ${scrolled ? 'border-slate-300 text-slate-700' : 'border-white/40 text-white'}`}>
                                {lang}
                                </button>
                                <button onClick={() => setIsMenuOpen(!isMenuOpen)} className={scrolled ? 'text-slate-800' : 'text-white'}>
                                {isMenuOpen ? <X /> : <Menu />}
                                </button>
                            </div>
                        </div>
                        {isMenuOpen && (
                            <div className="lg:hidden absolute top-full left-0 w-full bg-white shadow-xl py-4 flex flex-col px-6">
                                {Object.keys(t.nav).filter(k => k !== 'contact').map(key => (
                                    <button key={key} onClick={() => scrollToSection(key)} className="py-4 border-b text-left text-slate-700">{t.nav[key]}</button>
                                ))}
                                <div className="mt-6">
                                <div className="text-xs font-bold text-slate-400 uppercase mb-3">Language</div>
                                <div className="grid grid-cols-2 gap-3">
                                    {LANGUAGES.map(l => (
                                    <button key={l.code} onClick={() => { setLang(l.code); setIsMenuOpen(false); }} 
                                        className={`px-3 py-3 rounded-lg border text-sm font-medium ${lang === l.code ? 'border-amber-500 text-amber-600 bg-amber-50' : 'border-slate-200 text-slate-600'}`}>
                                        {l.name}
                                    </button>
                                    ))}
                                </div>
                                </div>
                            </div>
                        )}
                    </nav>

                    <section id="home" className="relative h-screen flex items-center justify-center bg-slate-900 text-white text-center px-4">
                        <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=2070" className="absolute inset-0 w-full h-full object-cover opacity-40" />
                        <div className="relative z-10 pt-10">
                            <span className="bg-white/10 px-4 py-1 rounded-full text-sm text-amber-300 border border-white/20">{t.hero.badge}</span>
                            <h1 className="text-4xl md:text-7xl font-serif font-bold my-6">{t.hero.title_1} <br/><span className="text-amber-400">{t.hero.title_2}</span></h1>
                            <p className="text-xl text-slate-200 max-w-2xl mx-auto mb-8">{t.hero.subtitle}</p>
                            <button onClick={() => scrollToSection('programs')} className="bg-amber-500 hover:bg-amber-600 text-white px-8 py-4 rounded-full font-bold text-lg">Explore Programs</button>
                        </div>
                    </section>

                    <section id="philosophy" className="py-24 bg-white">
                        <div className="container mx-auto px-4 grid md:grid-cols-2 gap-16 items-center">
                            <img src="https://images.unsplash.com/photo-1544367563-12123d8966cd?q=80&w=2070" className="rounded-2xl shadow-2xl" />
                            <div>
                                <h2 className="text-4xl font-serif font-bold text-slate-900 mb-6">{t.philosophy.title}</h2>
                                <p className="text-slate-600 text-lg mb-6">{t.philosophy.text_1}</p>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                                    {Object.values(t.philosophy.cards).map((c, i) => (
                                        <div key={i} className="flex gap-4"><div className="bg-amber-50 p-2 rounded-lg text-amber-600 h-fit"><Star size={20}/></div><div><h4 className="font-bold">{c.title}</h4><p className="text-sm text-slate-600">{c.desc}</p></div></div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </section>

                    <section id="programs" className="py-24 bg-slate-50">
                        <div className="container mx-auto px-4">
                            <SectionTitle title={t.programs.title} subtitle={t.programs.subtitle} />
                            <div className="grid md:grid-cols-3 gap-8">
                                {t.programs.items.map((p, i) => (
                                    <div key={i} className="bg-white rounded-2xl p-8 shadow-lg hover:-translate-y-2 transition-all">
                                        <div className="w-14 h-14 bg-amber-50 rounded-xl flex items-center justify-center text-amber-500 mb-6"><Heart size={28}/></div>
                                        <h3 className="text-2xl font-serif font-bold mb-2">{p.title}</h3>
                                        <p className="text-slate-600 mb-6">{p.desc}</p>
                                        <ul className="space-y-2 text-sm text-slate-500">{p.features.map((f,j)=><li key={j} className="flex gap-2"><div className="w-1.5 h-1.5 bg-amber-400 rounded-full mt-1.5"/>{f}</li>)}</ul>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    <section id="events" className="py-24 bg-white">
                        <div className="container mx-auto px-4">
                            <SectionTitle title={t.events.title} subtitle={t.events.subtitle} />
                            <div className="grid md:grid-cols-3 gap-8">
                                {blogEvents.map((ev, i) => (
                                    <div key={i} className="group bg-slate-50 rounded-2xl overflow-hidden border hover:border-amber-200 transition-all cursor-pointer" onClick={() => ev.content && setSelectedPost(ev)}>
                                        <div className="h-48 bg-slate-200 relative">
                                            <img src={`https://source.unsplash.com/random/800x600?meditation,${i}`} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                                            <div className="absolute top-4 left-4 bg-white p-2 rounded-lg text-center shadow font-bold"><div className="text-xs text-red-500">{ev.month}</div><div className="text-2xl text-slate-900">{ev.day}</div></div>
                                        </div>
                                        <div className="p-6">
                                            <h3 className="text-xl font-bold mb-2">{ev.title}</h3>
                                            <div className="text-sm text-slate-500 mb-6 flex gap-4"><span>📍 {ev.loc}</span><span>⏰ {ev.time}</span></div>
                                            <div className="flex gap-2">
                                                <button className="flex-1 py-2 bg-white border rounded-lg font-bold text-slate-600">Details</button>
                                                <button onClick={(e) => { e.stopPropagation(); setRegistrationEvent(ev); }} className="flex-1 py-2 bg-amber-500 text-white rounded-lg font-bold hover:bg-amber-600">Register</button>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>
                    
                    {/* --- MENTORS SECTION (Updated) --- */}
                    <section id="mentors" className="py-24 bg-slate-50">
                        <div className="container mx-auto px-4">
                            <SectionTitle title={t.mentors.title} subtitle={t.mentors.subtitle} />
                            <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-8">
                                {Object.keys(t.mentors.items).map((key, i) => {
                                    const mentorInfo = t.mentors.items[key];
                                    const mentorData = MENTORS_DATA.find(m => m.id === key) || {};
                                    return (
                                        <div 
                                            key={key} 
                                            onClick={() => setSelectedMentor({ ...mentorInfo, ...mentorData })}
                                            className="mentor-card relative group bg-white rounded-2xl overflow-hidden shadow-lg hover:shadow-2xl transition-all hover:-translate-y-2 cursor-pointer"
                                        >
                                            <div className="h-96 overflow-hidden">
                                                <img 
                                                    src={mentorData.image || mentorData.fallbackImage} 
                                                    onError={(e) => { e.target.onerror = null; e.target.src = mentorData.fallbackImage; }}
                                                    alt={mentorInfo.name} 
                                                    className="w-full h-full object-cover transition-transform duration-700 mentor-image" 
                                                />
                                            </div>
                                            
                                            {/* Hover Overlay (No text, just subtle interaction hint) */}
                                            <div className="absolute inset-0 bg-black/0 group-hover:bg-black/10 transition-all flex items-center justify-center">
                                                <span className="opacity-0 group-hover:opacity-100 bg-white/90 px-4 py-2 rounded-full text-sm font-bold shadow-lg transform translate-y-4 group-hover:translate-y-0 transition-all duration-300">View Profile</span>
                                            </div>

                                            {/* Name & Role (Always Visible) */}
                                            <div className="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-slate-900 via-slate-900/80 to-transparent p-6 pt-20">
                                                <h3 className="text-xl font-bold text-white mb-1">{mentorInfo.name}</h3>
                                                <p className="text-amber-400 font-medium text-sm uppercase tracking-wider">{mentorInfo.role}</p>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </section>

                    <section id="contact" className="py-24 bg-white">
                        <div className="container mx-auto px-4 grid lg:grid-cols-2 gap-12">
                            <div>
                                <SectionTitle title={t.contact.title} subtitle={t.contact.subtitle} centered={false} />
                                <div className="space-y-6 mt-8">
                                    <div className="flex gap-4 items-center p-6 bg-slate-50 rounded-xl shadow-sm border border-slate-100"><MapPin className="text-amber-500"/><div><h4 className="font-bold">Vizag Center</h4><p className="text-slate-500">Main Campus, Andhra Pradesh</p></div></div>
                                    <div className="flex gap-4 items-center p-6 bg-slate-50 rounded-xl shadow-sm border border-slate-100"><Phone className="text-amber-500"/><div><h4 className="font-bold">Phone</h4><p className="text-slate-500">+91 8008117037</p></div></div>
                                    <div className="flex gap-4 items-center p-6 bg-slate-50 rounded-xl shadow-sm border border-slate-100"><Mail className="text-amber-500"/><div><h4 className="font-bold">Email</h4><p className="text-slate-500">Divineparenting@gmail.com</p></div></div>
                                </div>
                            </div>
                            <div className="h-full"><CustomForm type="contact" /></div>
                        </div>
                    </section>

                    <footer className="bg-slate-900 text-slate-400 py-12 text-center border-t border-slate-800">
                        <p>© 2026 Divine Parenting Academy. All rights reserved.</p>
                    </footer>

                    <BlogPostModal post={selectedPost} onClose={() => setSelectedPost(null)} />
                    <MentorModal mentor={selectedMentor} onClose={() => setSelectedMentor(null)} />
                    <CustomForm type="register" isOpen={!!registrationEvent} prefillData={registrationEvent || {}} onClose={() => setRegistrationEvent(null)} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
