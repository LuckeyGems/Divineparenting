            </div>
        );

        const ContactForm = ({ t }) => {
            const [formData, setFormData] = useState({ name: '', email: '', phone: '', message: '' });
            const [status, setStatus] = useState('idle');

            const handleChange = (e) => setFormData(prev => ({ ...prev, [e.target.name]: e.target.value }));

            const handleSubmit = (e) => {
                e.preventDefault();
                setStatus('sending');
                setTimeout(() => {
                    setStatus('success');
                    setFormData({ name: '', email: '', phone: '', message: '' });
                    setTimeout(() => setStatus('idle'), 5000);
                }, 2000);
            };

            return (
                <form onSubmit={handleSubmit} className="bg-white p-6 md:p-8 rounded-2xl shadow-xl border border-slate-100">
                    <div className="space-y-4 md:space-y-6">
                        <div>
                            <label className="block text-sm font-medium text-slate-700 mb-1">{t.form?.name}</label>
                            <input required name="name" value={formData.name} onChange={handleChange} type="text" className="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-amber-500 outline-none" />
                        </div>
                        <div className="grid md:grid-cols-2 gap-4">

                                <label className="block text-sm font-medium text-slate-700 mb-1">{t.form?.email}</label>

                                    ))}
                                </div>
                            </div>
                        </div>
                    </section>

                    <section id="programs" className="py-24 bg-slate-100">
                        <div className="container mx-auto px-6">
                            <SectionTitle title={t.programs.title} subtitle={t.programs.subtitle} />
                            <div className="grid md:grid-cols-3 gap-8">
                                {t.programs.items.map((p, i) => (
                                    <div key={i} className="bg-white p-8 rounded-2xl shadow-md border-t-8 border-amber-500">
                                        <h3 className="text-2xl font-bold mb-2">{p.title}</h3>
                                        <p className="text-amber-600 font-bold text-sm mb-4">{p.subtitle}</p>
                                        <p className="text-slate-600 mb-6">{p.desc}</p>
                                        <ul className="space-y-2 text-sm">
                                            {p.features.map((f, idx) => <li key={idx}>• {f}</li>)}
                                        </ul>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    <section id="contact" className="py-24 container mx-auto px-6">
                        <div className="grid lg:grid-cols-2 gap-12">
                            <div>
                                <h2 className="text-4xl font-serif font-bold mb-6">{t.contact.title}</h2>
                                <p className="mb-8">{t.contact.subtitle}</p>
                                <div className="space-y-4">
                                    <div className="flex gap-4"><MapPin className="text-amber-500"/> <span>Vizag Pyramid Center, Visakhapatnam</span></div>
                                    <div className="flex gap-4"><Phone className="text-amber-500"/> <span>+91 8008117037</span></div>
                                    <div className="flex gap-4"><Mail className="text-amber-500"/> <span>Divineparenting@gmail.com</span></div>
                                </div>
                            </div>
                            <ContactForm t={t.contact} />
                        </div>
                    </section>

                    <footer className="bg-slate-900 text-slate-500 py-12 text-center">
                        <p>© 2026 Divine Parenting Academy. Inspired by Vizag Pyramid Spiritual Society.</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
