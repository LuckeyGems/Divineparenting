<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divine Parenting & Super Kids Academy</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        html { scroll-behavior: smooth; }
        .hero-bg { 
            background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.75)), 
            url('https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=2070'); 
            background-size: cover; 
            background-position: center; 
        }
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- COMPLETE TRANSLATION DATABASE ---
        const TRANSLATIONS = {
            en: {
                nav: { home: 'Home', philosophy: 'Philosophy', programs: 'Programs', events: 'Events', contact: 'Contact' },
                hero: {
                    title_1: "Today's Children are",
                    title_2: "Tomorrow's Citizens",
                    subtitle: 'Join the movement of Spiritual Motherhood to raise "Super Kids"—children who are physically strong, mentally sharp, and spiritually awakened.',
                    cta: 'Explore Programs'
                },
                philosophy: {
                    title: 'Children are the First Gurus',
                    text: 'We believe that parenting is a form of Brahmavidya. Our method combines ancient Indian wisdom, like the Abhimanyu Effect, with modern developmental techniques.',
                    cards: [
                        { title: 'Abhimanyu Status', desc: 'Learning begins in the womb through listening.' },
                        { title: 'Satvic Living', desc: 'Pure food and thoughts create a peaceful foundation.' },
                        { title: 'Raga Therapy', desc: 'Classical music stimulates brain development.' }
                    ]
                },
                programs: {
                    title: 'Our Holistic Curriculum',
                    items: [
                        { title: "Spiritual Motherhood", sub: "Prenatal", desc: "Creating a divine environment for the unborn child." },
                        { title: "Infant Siddha", sub: "0-12 Months", desc: "Stimulating brain cells and physical milestones." },
                        { title: "Super Kids", sub: "1-4 Years", desc: "Nurturing intellect and creativity in toddlers." }
                    ]
                },
                contact: {
                    title: 'Get in Touch',
                    form: { name: 'Name', email: 'Email', message: 'Message', submit: 'Send Message' }
                }
            },
            te: { 
                nav: { home: 'ముఖపత్రం', philosophy: 'తత్వం', programs: 'కార్యక్రమాలు', events: 'సంఘటనలు', contact: 'సంప్రదించండి' },
                hero: {
                    title_1: "నేటి బాలలే",
                    title_2: "రేపటి పౌరులు",
                    subtitle: '"సూపర్ కిడ్స్" పిల్లలను పెంచడానికి "ధ్యాన మాతృత్వం" ఉద్యమంలో చేరండి.',
                    cta: 'కార్యక్రమాలు చూడండి'
                },
                philosophy: {
                    title: 'పిల్లలే మొదటి గురువులు',
                    text: 'సంతాన పెంపకం అనేది ఒక కళ మరియు ఒక శాస్త్రం. మా పద్ధతి ప్రాచీన భారతీయ జ్ఞానాన్ని మరియు ఆధునిక పద్ధతులను మిళితం చేస్తుంది.',
                    cards: [
                        { title: 'అభిమన్యు స్థితి', desc: 'గర్భంలో నుండే అభ్యాసం మొదలవుతుంది.' },
                        { title: 'సాత్విక జీవనం', desc: 'స్వచ్ఛమైన ఆహారం ప్రశాంతమైన పునాదిని వేస్తుంది.' },
                        { title: 'రాగ చికిత్స', desc: 'సంగీతం మెదడు అభివృద్ధిని ప్రేరేపిస్తుంది.' }
                    ]
                },
                programs: {
                    title: 'మా సంపూర్ణ పాఠ్య ప్రణాళిక',
                    items: [
                        { title: "ధ్యాన మాతృత్వం", sub: "గర్భస్థ సంరక్షణ", desc: "పుట్టబోయే బిడ్డకు దివ్యమైన వాతావరణాన్ని సృష్టించడం." },
                        { title: "శిశు సిద్ధ కార్యక్రమం", sub: "0 – 12 నెలలు", desc: "మెదడు కణాలను మరియు శారీరక మైలురాళ్లను ప్రేరేపించడం." },
                        { title: "సూపర్ కిడ్స్", sub: "1 – 4 సంవత్సరాలు", desc: "పిల్లలలో మేధస్సు మరియు సృజనాత్మకతను పెంపొందించడం." }
                    ]
                },
                contact: {
                    title: 'మమ్మల్ని సంప్రదించండి',
                    form: { name: 'పేరు', email: 'ఇమెయిల్', message: 'సందేశం', submit: 'సందేశం పంపండి' }
                }
            }
        };

        // --- SAFE ICON HELPER ---
        const Icon = ({ name, className = "" }) => {
            const LucideIcon = lucide[name] || lucide.HelpCircle;
            return <LucideIcon className={className} size={24} />;
        };

        function App() {
            const [lang, setLang] = useState('en');
            const [scrolled, setScrolled] = useState(false);
            const t = TRANSLATIONS[lang];

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const scrollTo = (id) => document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });

            return (
                <div className="min-h-screen text-slate-800">
                    {/* Navigation */}
                    <nav className={`fixed w-full z-50 p-4 transition-all ${scrolled ? 'bg-white shadow-md' : 'bg-transparent'}`}>
                        <div className="container mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-2 font-bold text-xl cursor-pointer" onClick={() => window.scrollTo(0,0)}>
                                <div className="w-10 h-10 bg-amber-500 rounded-full flex items-center justify-center text-white">D</div>
                                <span className={scrolled ? 'text-slate-800' : 'text-white'}>Divine Parenting</span>
                            </div>
                            <div className="flex items-center gap-6">
                                <div className="hidden md:flex gap-4">
                                    {Object.keys(t.nav).map(key => (
                                        <button key={key} onClick={() => scrollTo(key)} className={`uppercase text-xs font-bold ${scrolled ? 'text-slate-600' : 'text-white'}`}>{t.nav[key]}</button>
                                    ))}
                                </div>
                                <select onChange={(e) => setLang(e.target.value)} className="bg-white border border-amber-500 text-amber-500 rounded px-2 py-1 text-xs font-bold outline-none">
                                    <option value="en">English</option>
                                    <option value="te">తెలుగు</option>
                                </select>
                            </div>
                        </div>
                    </nav>

                    {/* Hero Section */}
                    <section id="home" className="h-screen hero-bg flex items-center justify-center text-center text-white px-4">
                        <div className="max-w-4xl fade-in">
                            <h1 className="text-5xl md:text-7xl font-bold mb-4">{t.hero.title_1}</h1>
                            <h2 className="text-4xl md:text-6xl text-amber-400 font-bold mb-8">{t.hero.title_2}</h2>
                            <p className="max-w-2xl mx-auto text-lg text-slate-200 mb-10">{t.hero.subtitle}</p>
                            <button onClick={() => scrollTo('programs')} className="bg-amber-500 px-10 py-4 rounded-full font-bold text-lg hover:bg-amber-600 transition-all">{t.hero.cta}</button>
                        </div>
                    </section>

                    {/* Philosophy */}
                    <section id="philosophy" className="py-24 container mx-auto px-6">
                        <div className="grid md:grid-cols-2 gap-16 items-center">
                            <img src="https://images.unsplash.com/photo-1544367563-12123d8966cd?q=80&w=2070" className="rounded-3xl shadow-2xl" alt="Philosophy" />
                            <div>
                                <h2 className="text-4xl font-bold mb-6">{t.philosophy.title}</h2>
                                <p className="text-slate-600 text-lg mb-8">{t.philosophy.text}</p>
                                <div className="grid gap-4">
                                    {t.philosophy.cards.map((card, i) => (
                                        <div key={i} className="p-4 bg-white border-l-4 border-amber-500 shadow-sm rounded-r-xl">
                                            <h4 className="font-bold">{card.title}</h4>
                                            <p className="text-slate-500 text-sm">{card.desc}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Programs */}
                    <section id="programs" className="py-24 bg-slate-100">
                        <div className="container mx-auto px-6 text-center">
                            <h2 className="text-4xl font-bold mb-16">{t.programs.title}</h2>
                            <div className="grid md:grid-cols-3 gap-8">
                                {t.programs.items.map((p, i) => (
                                    <div key={i} className="bg-white p-8 rounded-3xl shadow-lg hover:-translate-y-2 transition-transform">
                                        <div className="w-12 h-12 bg-amber-100 text-amber-600 rounded-xl flex items-center justify-center mx-auto mb-6"><Icon name="Heart" /></div>
                                        <h3 className="text-2xl font-bold mb-2">{p.title}</h3>
                                        <p className="text-amber-500 font-bold text-xs uppercase mb-4">{p.sub}</p>
                                        <p className="text-slate-600">{p.desc}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Contact Form */}
                    <section id="contact" className="py-24 container mx-auto px-6">
                        <div className="max-w-4xl mx-auto grid md:grid-cols-2 gap-12 bg-white rounded-3xl shadow-2xl overflow-hidden">
                            <div className="bg-slate-900 p-12 text-white">
                                <h2 className="text-3xl font-bold mb-6">{t.contact.title}</h2>
                                <div className="space-y-6">
                                    <div className="flex gap-4"><Icon name="MapPin" className="text-amber-500" /> Vizag Pyramid Center, AP</div>
                                    <div className="flex gap-4"><Icon name="Phone" className="text-amber-500" /> +91 8008117037</div>
                                    <div className="flex gap-4"><Icon name="Mail" className="text-amber-500" /> Divineparenting@gmail.com</div>
                                </div>
                            </div>
                            <form className="p-12 space-y-4" onSubmit={(e) => e.preventDefault()}>
                                <input className="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-amber-500" placeholder={t.contact.form.name} />
                                <input className="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-amber-500" placeholder={t.contact.form.email} />
                                <textarea className="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-amber-500" rows="4" placeholder={t.contact.form.message}></textarea>
                                <button className="w-full py-4 bg-amber-500 text-white font-bold rounded-xl hover:bg-amber-600 transition-colors">
                                    {t.contact.form.submit}
                                </button>
                            </form>
                        </div>
                    </section>

                    <footer className="bg-slate-900 text-slate-500 py-12 text-center">
                        <p>© 2026 Divine Parenting Academy. Inspired by Vizag Pyramid Spiritual Society.</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
