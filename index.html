<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divine Parenting & Super Kids Academy</title>
    <meta name="description" content="Join the movement of Spiritual Motherhood to raise Super Kids.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        html { scroll-behavior: smooth; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- TRANSLATIONS ---
        const TRANSLATIONS = {
            en: {
                nav: { home: 'Home', philosophy: 'Philosophy', programs: 'Programs', events: 'Events', contact: 'Contact' },
                hero: {
                    title_1: "Today's Children are",
                    title_2: "Tomorrow's Citizens",
                    subtitle: 'Join the movement of Spiritual Motherhood to raise "Super Kids"—children who are physically strong, mentally sharp, and spiritually awakened.',
                    cta: 'Explore Programs'
                },
                philosophy: {
                    title: 'Children are the First Gurus',
                    text_1: 'We believe that parenting is a dynamic process—an art and a science, a form of Brahmavidya.',
                    cards: [
                        { title: 'Abhimanyu Status', desc: 'Learning begins in the womb through listening and feeling.' },
                        { title: 'Satvic Living', desc: 'Pure food and thoughts create a peaceful foundation.' }
                    ]
                },
                programs: {
                    title: 'Our Holistic Curriculum',
                    items: [
                        { title: "Spiritual Motherhood", subtitle: "Prenatal Care", desc: "Creating a divine environment for the unborn child." },
                        { title: "Infant Siddha Program", subtitle: "0 – 12 Months", desc: "Stimulating brain cells and physical milestones." },
                        { title: "Super Kids", subtitle: "1 – 4 Years", desc: "Nurturing intellect and creativity in toddlers." }
                    ]
                },
                contact: {
                    title: 'Get in Touch',
                    subtitle: 'Have questions? Send us a message directly.',
                    form: { name: 'Name', email: 'Email', message: 'Message', submit: 'Send Message', sending: 'Sending...' }
                }
            },
            te: { 
                nav: { home: 'ముఖపత్రం', philosophy: 'తత్వం', programs: 'కార్యక్రమాలు', events: 'సంఘటనలు', contact: 'సంప్రదించండి' },
                hero: {
                    title_1: "నేటి బాలలే",
                    title_2: "రేపటి పౌరులు",
                    subtitle: '"సూపర్ కిడ్స్" - శారీరకంగా దృఢమైన, మానసికంగా చురుకైన మరియు ఆధ్యాత్మికంగా మేల్కొన్న పిల్లలను పెంచడానికి "ధ్యాన మాతృత్వం" ఉద్యమంలో చేరండి.',
                    cta: 'కార్యక్రమాలు చూడండి'
                },
                philosophy: {
                    title: 'పిల్లలే మొదటి గురువులు',
                    text_1: 'సంతాన పెంపకం అనేది ఒక కళ మరియు ఒక శాస్త్రం, ఇది ఒక బ్రహ్మవిద్య అని మేము నమ్ముతున్నాము.',
                    cards: [
                        { title: 'అభిమన్యు స్థితి', desc: 'గర్భంలో నుండే వినడం మరియు అనుభూతి చెందడం ద్వారా అభ్యాసం మొదలవుతుంది.' },
                        { title: 'సాత్విక జీవనం', desc: 'స్వచ్ఛమైన ఆహారం మరియు ఆలోచనలు ప్రశాంతమైన పునాదిని వేస్తాయి.' }
                    ]
                },
                programs: {
                    title: 'మా సంపూర్ణ పాఠ్య ప్రణాళిక',
                    items: [
                        { title: "ధ్యాన మాతృత్వం", subtitle: "గర్భస్థ సంరక్షణ", desc: "అనుబంధం మరియు శాంతి ద్వారా పుట్టబోయే బిడ్డకు దివ్యమైన వాతావరణాన్ని సృష్టించడం." },
                        { title: "శిశు సిద్ధ కార్యక్రమం", subtitle: "0 – 12 నెలలు", desc: "మొదటి రోజుల నుండే మెదడు కణాలను ప్రేరేపించడం." },
                        { title: "సూపర్ కిడ్స్", subtitle: "1 – 4 సంవత్సరాలు", desc: "పిల్లలలో మేధస్సు మరియు సృజనాత్మకతను పెంపొందించడం." }
                    ]
                },
                contact: {
                    title: 'మమ్మల్ని సంప్రదించండి',
                    subtitle: 'ప్రశ్నలు ఉన్నాయా? మాకు సందేశం పంపండి.',
                    form: { name: 'పేరు', email: 'ఇమెయిల్', message: 'సందేశం', submit: 'సందేశం పంపండి', sending: 'పంపుతోంది...' }
                }
            }
        };

        // --- COMPONENTS ---
        const Icon = ({ name, className = "" }) => {
            const LucideIcon = lucide[name] || lucide.HelpCircle;
            return <LucideIcon className={className} size={20} />;
        };

        const ContactForm = ({ t }) => {
            const [status, setStatus] = useState('idle');
            const handleSubmit = (e) => {
                e.preventDefault();
                setStatus('sending');
                setTimeout(() => setStatus('idle'), 3000);
            };

            return (
                <form onSubmit={handleSubmit} className="bg-white p-8 rounded-2xl shadow-lg space-y-4">
                    <input required className="w-full p-3 border rounded-lg" placeholder={t.form.name} />
                    <input required type="email" className="w-full p-3 border rounded-lg" placeholder={t.form.email} />
                    <textarea required className="w-full p-3 border rounded-lg" rows="4" placeholder={t.form.message}></textarea>
                    <button className="w-full py-4 bg-amber-500 text-white font-bold rounded-xl flex items-center justify-center gap-2">
                        {status === 'sending' ? <Icon name="Loader2" className="animate-spin" /> : <Icon name="Send" />}
                        {status === 'sending' ? t.form.sending : t.form.submit}
                    </button>
                </form>
            );
        };

        function App() {
            const [lang, setLang] = useState('en');
            const [scrolled, setScrolled] = useState(false);
            const t = TRANSLATIONS[lang];

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const scrollTo = (id) => document.getElementById(id).scrollIntoView({ behavior: 'smooth' });

            return (
                <div className="min-h-screen">
                    <nav className={`fixed w-full z-50 p-4 transition-all ${scrolled ? 'bg-white shadow-md' : 'bg-transparent'}`}>
                        <div className="container mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-2 font-bold text-xl cursor-pointer" onClick={() => window.scrollTo(0,0)}>
                                <div className="w-10 h-10 bg-amber-500 rounded-full flex items-center justify-center text-white">D</div>
                                <span className={scrolled ? 'text-slate-800' : 'text-white'}>Divine Parenting</span>
                            </div>
                            <div className="flex items-center gap-6">
                                <div className="hidden md:flex gap-4">
                                    {Object.keys(t.nav).map(key => (
                                        <button key={key} onClick={() => scrollTo(key)} className={`uppercase text-xs font-bold ${scrolled ? 'text-slate-600' : 'text-white'}`}>{t.nav[key]}</button>
                                    ))}
                                </div>
                                <select onChange={(e) => setLang(e.target.value)} className="bg-transparent border border-amber-500 text-amber-500 rounded px-2 py-1 text-sm font-bold">
                                    <option value="en">English</option>
                                    <option value="te">తెలుగు</option>
                                </select>
                            </div>
                        </div>
                    </nav>

                    <section id="home" className="h-screen relative flex items-center justify-center bg-slate-900 text-white text-center px-4">
                        <div className="absolute inset-0 opacity-40">
                            <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=2070" className="w-full h-full object-cover" alt="Background" />
                        </div>
                        <div className="relative z-10">
                            <h1 className="text-5xl md:text-7xl font-bold mb-4">{t.hero.title_1}</h1>
                            <h2 className="text-4xl md:text-6xl text-amber-400 font-bold mb-8">{t.hero.title_2}</h2>
                            <p className="max-w-2xl mx-auto text-lg md:text-xl text-slate-200 mb-10">{t.hero.subtitle}</p>
                            <button onClick={() => scrollTo('programs')} className="bg-amber-500 px-10 py-4 rounded-full font-bold text-lg hover:bg-amber-600 transition-all">{t.hero.cta}</button>
                        </div>
                    </section>

                    <section id="philosophy" className="py-24 container mx-auto px-6">
                        <div className="grid md:grid-cols-2 gap-16 items-center">
                            <img src="https://images.unsplash.com/photo-1544367563-12123d8966cd?q=80&w=2070" className="rounded-3xl shadow-2xl" alt="Philosophy" />
                            <div>
                                <h2 className="text-4xl font-bold text-slate-800 mb-6">{t.philosophy.title}</h2>
                                <p className="text-slate-600 text-lg mb-8">{t.philosophy.text_1}</p>
                                <div className="grid gap-4">
                                    {t.philosophy.cards.map((card, i) => (
                                        <div key={i} className="p-4 bg-white border-l-4 border-amber-500 shadow-sm rounded-r-xl">
                                            <h4 className="font-bold text-slate-800">{card.title}</h4>
                                            <p className="text-slate-500 text-sm">{card.desc}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </section>

                    <section id="programs" className="py-24 bg-slate-100">
                        <div className="container mx-auto px-6 text-center">
                            <h2 className="text-4xl font-bold mb-16">{t.programs.title}</h2>
                            <div className="grid md:grid-cols-3 gap-8">
                                {t.programs.items.map((p, i) => (
                                    <div key={i} className="bg-white p-8 rounded-3xl shadow-lg hover:-translate-y-2 transition-transform">
                                        <div className="w-12 h-12 bg-amber-100 text-amber-600 rounded-xl flex items-center justify-center mx-auto mb-6"><Icon name="Heart" /></div>
                                        <h3 className="text-2xl font-bold mb-2">{p.title}</h3>
                                        <p className="text-amber-500 font-bold text-xs uppercase mb-4">{p.subtitle}</p>
                                        <p className="text-slate-600">{p.desc}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    <section id="contact" className="py-24 container mx-auto px-6">
                        <div className="grid lg:grid-cols-2 gap-12">
                            <div>
                                <h2 className="text-4xl font-bold mb-6">{t.contact.title}</h2>
                                <p className="text-slate-600 mb-10 text-lg">{t.contact.subtitle}</p>
                                <div className="space-y-6">
                                    <div className="flex gap-4 items-center">
                                        <div className="w-12 h-12 bg-amber-50 text-amber-500 rounded-full flex items-center justify-center"><Icon name="MapPin" /></div>
                                        <div><h5 className="font-bold">Location</h5><p className="text-slate-500">Vizag Pyramid Center, AP</p></div>
                                    </div>
                                    <div className="flex gap-4 items-center">
                                        <div className="w-12 h-12 bg-sky-50 text-sky-500 rounded-full flex items-center justify-center"><Icon name="Phone" /></div>
                                        <div><h5 className="font-bold">Contact</h5><p className="text-slate-500">+91 8008117037</p></div>
                                    </div>
                                </div>
                            </div>
                            <ContactForm t={t} />
                        </div>
                    </section>

                    <footer className="bg-slate-900 text-slate-500 py-12 text-center">
                        <p>© 2026 Divine Parenting Academy. Inspired by Vizag Pyramid Spiritual Society.</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
