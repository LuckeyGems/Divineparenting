                    items: { 
                        patriji: { name: "బ్రహ్మర్షి సుభాష్ పత్రీజీ", role: "వ్యవస్థాపకులు, PSSM", desc: "బ్రహ్మశ్రీ సుభాష్ పత్రీజీ పిరమిడ్ ఆధ్యాత్మిక సంఘాల ఉద్యమం (PSSM) వ్యవస్థాపకులు. లక్షలాది మందికి ధ్యానం మరియు శాఖాహారం యొక్క ప్రాముఖ్యతను బోధించడానికి తన జీవితాన్ని అంకితం చేశారు. సంతాన పెంపకంలో కూడా 'ఆధ్యాత్మిక సత్యం' చాలా అవసరమని పత్రీజీ నొక్కి చెబుతారు. తల్లిదండ్రులు ఆధ్యాత్మిక పద్ధతులను అవలంబించినప్పుడు, వారు తమ పిల్లల కోసం అత్యంత సానుకూలమైన వాతావరణాన్ని సృష్టిస్తారు. ఆనాపానసతి ధ్యానాన్ని దైనందిన జీవితంలో భాగం చేసుకోవడం ద్వారా, అద్భుతమైన 'సూపర్ కిడ్స్' ను పెంచవచ్చని ఆయన బోధిస్తున్నారు." }, 
                        gkSir: { name: "డా. గోపాలకృష్ణ (GK)", role: "మార్గదర్శి", desc: "డాక్టర్ గోపాలకృష్ణ (జికె సార్) ఆధ్యాత్మిక ശാస్త్రం మరియు సంపూర్ణ ఆరోగ్య రంగంలో ఒక అద్భుతమైన మార్గదర్శకులు. పురాతన ఆధ్యాత్మిక జ్ఞానాన్ని ఆధునిక శాస్త్రీయ విధానాలతో ఏకీకృతం చేసే స్పిరిచువల్ టాబ్లెట్స్ భావన వ్యవస్థాపకుడు. బాల్య అభివృద్ధి యొక్క ప్రాముఖ్యతను గుర్తిస్తూ, ఆయన ఇన్ఫాంట్ సిద్ధ ప్రోగ్రామ్ (ISP) ను ప్రవేశపెట్టారు. తన పరిశోధన మరియు వర్క్‌షాప్‌ల ద్వారా, ఎంతో మంది తల్లిదండ్రులకు మార్గదర్శనం చేశారు. గర్భస్థ శిశువుపై తల్లి మానసిక స్థితి యొక్క లోతైన ప్రభావాన్ని ఆయన తన విధానాల ద్వారా వివరించారు." },

                        santoshi: { name: "సంతోషి లక్ష్మి", role: "పేరెంటింగ్ కోచ్", desc: "సంతోషి లక్ష్మి గారు జీనియస్ కిడ్స్ ప్రీస్కూల్ వ్యవస్థాపకురాలు మరియు పేరెంటింగ్ కోచ్. ఆమె 28 సంవత్సరాలకు పైగా ఆనాపానసతి ధ్యానాన్ని ఆచరిస్తున్నారు. ఆంధ్ర విశ్వవిద్యాలయం నుండి MBA, సంగీతంలో బ్యాచిలర్ ఆఫ్ ఆర్ట్స్ మరియు చైల్డ్ సైకాలజీలో పీజీ డిప్లొమా (PGDACC) పూర్తి చేశారు. ఉపాధ్యాయురాలిగా, రిలేషన్‌షిప్ కౌన్సెలర్‌గా మరియు ప్రీస్కూల్ ప్రిన్సిపాల్‌గా సుదీర్ఘ అనుభవం ఉంది. 2008లో తన బిడ్డపై ఇన్‌ఫాంట్ ఎడ్యుకేషన్ పద్ధతులను విజయవంతంగా అమలు చేసి, ఆ పద్ధతుల విశిష్టతను నిరూపించారు." },

                        swathi: { name: "స్వాతి రావు", role: "సైకాలజిస్ట్", desc: "స్వాతి రావు గారు సైకాలజిస్ట్, బిహేవియరల్ థెరపిస్ట్ మరియు మెంటల్ హెల్త్ కౌన్సెలర్. సైకాలజీలో ఎం.ఏ మరియు చైల్డ్ గైడెన్స్‌లో పీజీ డిప్లొమా చేసిన ఆమె, డివైన్ పేరెంటింగ్ అకాడమీలో మానవ ప్రవర్తన గురించి లోతైన అవగాహనను తీసుకువచ్చారు. శారీరక, మానసిక, సామాజిక మరియు ఆధ్యాత్మిక కోణాలను పరిష్కరించడం సంపూర్ణ శ్రేయస్సుకు అవసరమని ఆమె నొక్కి చెబుతారు. ఎ.పి సమగ్ర శిక్షా ప్రాజెక్ట్‌తో పాటు ఆటిజం పిల్లలకు థెరపిస్ట్‌గా చురుకుగా పనిచేస్తున్నారు. 'ఆధ్యాత్మిక బుద్ధే మూలం, శారీరక ఆరోగ్యమే ఫలం' అనేది ఆమె విధానం." }

        const CustomForm = ({ prefillData = {}, type = 'contact', isOpen, onClose, formLabels }) => {

            // Ensure labels fallback safely to avoid 'undefined' errors
            const labels = formLabels || TRANSLATIONS.en.formLabels;

            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');

            const handleSubmit = (e) => {
                setIsLoading(true);
                setTimeout(() => {

                    setSubmitted(true);

                setSubmitted(false);
                setIsLoading(false);
                setFormKey(p => p + 1);

            };

            const parseDate = (dateStr) => {
                if(!dateStr) return { y: '', m: '', d: '' };
                const [y, m, d] = dateStr.split('-');
                return { y, m, d };

            const eventDateParts = type === 'register' ? parseDate(prefillData.dateValue) : {y: yyyy, m: mm, d: dd};

            const formContentJSX = (

                                        <div className="grid grid-cols-2 gap-4">

                                            <input type="text" value={`${prefillData.day} ${prefillData.month}`} readOnly className="w-full bg-transparent border-b border-amber-200 font-medium"/></div>
                                            <div><label className="block text-xs font-bold text-slate-500">{labels.time}</label>
                                            <input type="text" value={prefillData.time || '10:00'} readOnly className="w-full bg-transparent border-b border-amber-200 font-medium"/></div>
                                        </div>
                                    </div>

                                <input type="hidden" name={FORM_CONFIG.fields.eventStartDate + "_year"} value={eventDateParts.y} />
                                <input type="hidden" name={FORM_CONFIG.fields.eventStartDate + "_month"} value={eventDateParts.m} />
                                <input type="hidden" name={FORM_CONFIG.fields.eventStartDate + "_day"} value={eventDateParts.d} />

                                <input type="hidden" name={FORM_CONFIG.fields.eventEndDate + "_month"} value={eventDateParts.m} />

                                    <div><label className="block text-sm font-medium text-slate-700">{labels.name} *</label>
                                    <input required name={FORM_CONFIG.fields.name} type="text" className="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-amber-500 outline-none" /></div>
                                    
                                    <div className="grid md:grid-cols-2 gap-4">
                                        <div><label className="block text-sm font-medium text-slate-700">{labels.phone} *</label>
                                        <input required name={FORM_CONFIG.fields.phone} type="tel" className="w-full px-4 py-3 rounded-lg border border-slate-300 outline-none" /></div>

                    const scrollAmount = 310; // width of short (280px) + gap (approx 30px)
                    shortsScrollRef.current.scrollBy({
                        left: direction === 'left' ? -scrollAmount : scrollAmount,
                        behavior: 'smooth'
                    });
                }
            };

            // Carousel Effect
            useEffect(() => {
                const timer = setInterval(() => {
                    setCurrentSlide((prev) => (prev + 1) % HERO_WALLPAPERS.length);
                }, 5000); 
                return () => clearInterval(timer);
            }, []);

            // --- FETCH LOCAL EVENTS ---
            useEffect(() => {
                const fetchLocalEvents = async () => {
                    try {
                        const response = await fetch('assets/data/events.json');
                        const data = await response.json();
                        
                        if (data.feed && data.feed.entry) {
                            const formattedEvents = data.feed.entry.map(entry => {
                                const publishedDate = new Date(entry.published.$t);
                                let imageUrl = entry.media$thumbnail ? entry.media$thumbnail.url.replace('/s72-c/', '/s600/') : null;
                                if (!imageUrl && entry.content && entry.content.$t) {
                                     const imgMatch = entry.content.$t.match(/src="([^"]+)"/);
                                     if (imgMatch) imageUrl = imgMatch[1];
                                }
                                return {
                                    title: entry.title.$t,
                                    content: entry.content.$t,
                                    published: entry.published.$t,
                                    day: publishedDate.getDate().toString().padStart(2, '0'),
                                    month: publishedDate.toLocaleString('default', { month: 'short' }).toUpperCase(),
                                    dateValue: entry.published.$t.split('T')[0],
                                    loc: 'Divine Parenting Center', 
                                    time: '10:00 AM',
                                    image: imageUrl
                                };
                            });
                            setBlogEvents(formattedEvents);
                        }
                    } catch (error) {
                        console.log("Using fallback events.");
                        setBlogEvents(t.events.items);
                    }
                };

                fetchLocalEvents();

            const allEvents = blogEvents.length > 0 ? blogEvents : t.events.items;
            const [hasCheckedUrl, setHasCheckedUrl] = useState(false);

            useEffect(() => {
                if (allEvents.length > 0 && !hasCheckedUrl) {
                    const params = new URLSearchParams(window.location.search);
                    const eventQuery = params.get('event');
                    if (eventQuery) {
                        const decodedTitle = decodeURIComponent(eventQuery);
                        const foundEvent = allEvents.find(ev => ev.title === decodedTitle);
                        if (foundEvent) {
                            setSelectedEventDetails(foundEvent);
                        }

                    setHasCheckedUrl(true);

                        id: `mock_short_${i}`,

                    const response = await fetch('https://ipapi.co/json/');

                    if (data && data.country_code === 'IN') {
                        const region = data.region_code;
                        if (region === 'AP' || region === 'TG') setLang('te');
                        else if (region === 'TN') setLang('ta');
                        else if (['DL', 'UP', 'MP', 'RJ', 'HR'].includes(region)) setLang('hi');
                        else if (region === 'KL') setLang('ml'); 
                        else if (region === 'KA') setLang('kn'); 
                    }
                } catch (e) { console.log('Lang default: en'); }
                };

                window.addEventListener('scroll', handleScroll);

                    <section id="events" className="py-24 bg-white border-t border-slate-100">
                        <div className="container mx-auto px-4">
                            <SectionTitle title={t.events.title} subtitle={t.events.subtitle} />
                            <div className="grid md:grid-cols-3 gap-8">
                                {allEvents.map((ev, i) => (
                                    <div key={i} className="group bg-slate-50 rounded-2xl overflow-hidden shadow hover:shadow-lg transition-all border border-slate-100">
                                        <div className="h-48 bg-slate-200 relative cursor-pointer" onClick={() => ev.content && setSelectedEventDetails(ev)}>
                                            <img 
                                                src={ev.image || `assets/Events/Event${i + 1}_date_02082026.jpg`} 
                                                onError={(e) => { e.target.onerror = null; e.target.src = 'https://via.placeholder.com/800x600?text=Event+Poster'; }}
                                                className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" 
                                                alt={ev.title}
                                            />
                                            <div className="absolute top-4 left-4 bg-white p-2 rounded-lg text-center shadow font-bold"><div className="text-xs text-red-500">{ev.month}</div><div className="text-2xl text-slate-900">{ev.day}</div></div>
                                        </div>
                                        <div className="p-6">
                                            <h3 className="text-xl font-bold mb-2 line-clamp-1">{ev.title}</h3>
                                            <div className="text-sm text-slate-500 mb-6 flex gap-4"><span>📍 {ev.loc}</span><span>⏰ {ev.time}</span></div>
                                            <div className="flex gap-2">
                                                <button onClick={() => setSelectedEventDetails(ev)} className="w-full py-3 bg-amber-500 text-white rounded-xl font-bold hover:bg-amber-600 shadow-md transition-colors">
                                                    {t.events.viewDetails || 'View Details'}
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* --- NEW: EVENT GALLERIES (PHOTOS GROUPED BY EVENT) --- */}
                    {SHOW_EVENT_GALLERY && (
                        <section id="event-galleries" className="py-24 bg-slate-50 border-t border-slate-100">
                            <div className="container mx-auto px-4">
                                <SectionTitle title={t.eventGallery?.title || TRANSLATIONS.en.eventGallery.title} subtitle={t.eventGallery?.subtitle || TRANSLATIONS.en.eventGallery.subtitle} />
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                    {EVENT_GALLERIES.map((gallery, i) => (
                                        <div key={i} onClick={() => setSelectedGalleryIndex(i)} className="group cursor-pointer">
                                            <div className="aspect-[4/3] rounded-2xl overflow-hidden relative shadow-lg border border-slate-200">
                                                <img 
                                                    src={gallery.thumbnail} 
                                                    onError={(e) => { e.target.onerror = null; e.target.src = 'https://via.placeholder.com/600x400?text=Event+Thumb'; }}
                                                    alt={gallery.title} 
                                                    className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" 
                                                />
                                                <div className="absolute inset-0 bg-gradient-to-t from-slate-900/90 via-slate-900/30 to-transparent opacity-80 group-hover:opacity-100 transition-opacity"></div>
                                                
                                                <div className="absolute inset-0 flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition-all duration-300 transform translate-y-4 group-hover:translate-y-0">
                                                    <div className="bg-amber-500 text-white p-4 rounded-full shadow-xl mb-3">
                                                        <ImageIcon size={32} />
                                                    </div>
                                                </div>
                                                
                                                <div className="absolute bottom-0 left-0 right-0 p-6">
                                                    <h3 className="text-xl font-bold text-white mb-1 leading-tight">{gallery.title}</h3>
                                                    <p className="text-amber-400 text-sm font-bold">{gallery.photos.length} Photos</p>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </section>
                    )}
                    
                    {/* --- BOOKS & RESOURCES SECTION --- */}
                    <section id="books" className="py-24 bg-white relative overflow-hidden border-t border-slate-100">
                        <div className="absolute top-0 right-0 w-96 h-96 bg-amber-100 rounded-full blur-3xl opacity-30 pointer-events-none"></div>
                        <div className="container mx-auto px-4 relative z-10">
                            <SectionTitle title={t.books.title} subtitle={t.books.subtitle} />
                            
                            <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                                {Object.keys(t.books.items).map((key, i) => {
                                    const bookInfo = t.books.items[key];
                                    const bookData = BOOKS_DATA.find(b => b.id === key) || {};
                                    return (
                                        <div key={i} className="book-card bg-slate-50 rounded-2xl overflow-hidden shadow border border-slate-100 transition-all duration-300 group flex flex-col">
                                            <div className="h-64 bg-slate-200 overflow-hidden relative">
                                                 <img 
                                                    src={bookData.image} 
                                                    onError={(e) => { e.target.onerror = null; e.target.src = 'https://via.placeholder.com/300x400?text=Book+Cover'; }}
                                                    alt={bookInfo.title} 
                                                    className="w-full h-full object-cover" 
                                                 />
                                                 <div className="absolute inset-0 bg-black/10 group-hover:bg-black/0 transition-colors"></div>
                                            </div>
                                            <div className="p-6 flex-1 flex flex-col">
                                                <div className="flex items-center gap-2 text-xs text-amber-600 font-bold mb-3 uppercase tracking-wider">
                                                    <Book size={14} /> Book / E-Book
                                                </div>
                                                <h3 className="text-xl font-bold text-slate-900 mb-3">{bookInfo.title}</h3>
                                                <p className="text-slate-600 text-sm mb-6 flex-1">{bookInfo.desc}</p>
                                                
                                                <a href={bookData.pdfUrl} download className="w-full py-3 bg-white border-2 border-slate-200 text-slate-700 rounded-xl font-bold hover:border-amber-500 hover:text-amber-600 transition-colors flex items-center justify-center gap-2">
                                                    <Download size={18} />
                                                    {t.books.download}
                                                </a>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </section>

                    {/* --- MEDIA (YOUTUBE & PHOTOS) SECTION --- */}
                    <section id="media" className="py-24 bg-slate-50 border-t border-slate-100">
                        <div className="container mx-auto px-4">
                            <SectionTitle title={t.media?.title || TRANSLATIONS.en.media.title} subtitle={t.media?.subtitle || TRANSLATIONS.en.media.subtitle} />

                            <div className="bg-gradient-to-r from-red-500 to-rose-600 rounded-3xl p-8 md:p-12 text-white shadow-xl mb-16 flex flex-col md:flex-row items-center justify-between gap-8">
                                <div>
                                    <h3 className="text-3xl font-bold mb-2">{t.media?.subscribe || TRANSLATIONS.en.media.subscribe}</h3>
                                    <p className="text-red-100 text-lg">{t.media?.subscribeText || TRANSLATIONS.en.media.subscribeText}</p>
                                </div>
                                <a href="https://www.youtube.com/@divineparenting4600" target="_blank" rel="noopener noreferrer" className="bg-white text-red-600 px-8 py-4 rounded-full font-bold text-lg hover:scale-105 transition-transform shadow-lg whitespace-nowrap flex items-center gap-2">
                                    <Youtube size={24} />
                                    Subscribe Now
                                </a>
                            </div>

                            <div className="mb-16">
                                <h3 className="text-2xl font-bold text-slate-800 mb-8 flex items-center gap-2"><Globe className="text-amber-500"/> {t.media?.featured || TRANSLATIONS.en.media.featured}</h3>
                                <div className="grid md:grid-cols-2 gap-8">
                                    {MAIN_VIDEOS.map((vid, idx) => {
                                        const videoId = getYouTubeId(vid);
                                        return (
                                            <div key={idx} 
                                                 className="aspect-video bg-slate-900 rounded-2xl overflow-hidden shadow-lg border border-slate-100 relative group cursor-pointer"
                                                 onClick={() => setSelectedVideo(videoId)}>
                                                {/* High Quality Thumbnail with Fallback */}
                                                <img 
                                                    src={`https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`} 
                                                    onError={(e) => { e.target.onerror = null; e.target.src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`; }}
                                                    alt="Featured Video Thumbnail" 
                                                    className="w-full h-full object-cover opacity-80 group-hover:scale-105 group-hover:opacity-100 transition-all duration-500" 
                                                />
                                                {/* Play Button Overlay */}
                                                <div className="absolute inset-0 bg-black/20 group-hover:bg-transparent transition-colors flex items-center justify-center">
                                                    <div className="w-16 h-16 bg-red-600/90 backdrop-blur-sm rounded-full flex items-center justify-center shadow-lg group-hover:scale-110 group-hover:bg-red-600 transition-all duration-300">
                                                        <svg className="w-8 h-8 text-white ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            <div className="mb-16">
                                <h3 className="text-2xl font-bold text-slate-800 mb-8 flex items-center gap-2"><Camera className="text-amber-500"/> {t.media?.shorts || TRANSLATIONS.en.media.shorts}</h3>
                                <div className="relative group">
                                    {/* Left Scroll Button (Desktop only) */}
                                    <button onClick={() => scrollShorts('left')} className="hidden md:flex absolute left-0 top-[40%] -translate-y-1/2 -translate-x-4 z-10 bg-white shadow-xl rounded-full p-3 text-slate-800 hover:text-amber-500 hover:scale-110 transition-all border border-slate-200 opacity-0 group-hover:opacity-100 focus:opacity-100">
                                        <ChevronLeft size={24} />
                                    </button>

                                    <div ref={shortsScrollRef} className="flex overflow-x-auto gap-6 pb-8 snap-x snap-mandatory hide-scroll-bar scroll-smooth">
                                        {youtubeShorts.map((short, idx) => (
                                            <div key={idx} className="min-w-[280px] w-[280px] aspect-[9/16] bg-slate-800 rounded-2xl flex-shrink-0 snap-center overflow-hidden relative shadow-lg group/short cursor-pointer"
                                                 onClick={() => setSelectedVideo(short.videoId)}>
                                                <img 
                                                    src={`https://img.youtube.com/vi/${short.videoId}/maxresdefault.jpg`} 
                                                    onError={(e) => { e.target.onerror = null; e.target.src = `https://img.youtube.com/vi/${short.videoId}/hqdefault.jpg`; }} 
                                                    alt="Short Thumbnail" 
                                                    className="w-full h-full object-cover opacity-80 group-hover/short:scale-105 transition-transform duration-500"
                                                />
                                                <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent flex flex-col justify-end p-6">
                                                    <div className="w-10 h-10 bg-red-600 rounded-full flex items-center justify-center mb-4 shadow-lg group-hover/short:scale-110 transition-transform">
                                                        <svg className="w-4 h-4 text-white ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                                    </div>
                                                    <h4 className="text-white font-bold line-clamp-2 leading-tight">{short.title}</h4>
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    {/* Right Scroll Button (Desktop only) */}
                                    <button onClick={() => scrollShorts('right')} className="hidden md:flex absolute right-0 top-[40%] -translate-y-1/2 translate-x-4 z-10 bg-white shadow-xl rounded-full p-3 text-slate-800 hover:text-amber-500 hover:scale-110 transition-all border border-slate-200 opacity-0 group-hover:opacity-100 focus:opacity-100">
                                        <ChevronRight size={24} />
                                    </button>
                                </div>
                            </div>

                        </div>
                    </section>
                    
                    {/* --- MENTORS SECTION (Strict Ordered List) --- */}
                    <section id="mentors" className="py-24 bg-white border-t border-slate-100">
                        <div className="container mx-auto px-4">
                            <SectionTitle title={t.mentors.title} subtitle={t.mentors.subtitle} />
                            <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                                {MENTORS_DATA.map((mentorData, i) => {
                                    const mentorInfo = t.mentors.items[mentorData.id] || {};
                                    if(!mentorInfo.name) return null; 
                                    return (
                                        <div 
                                            key={mentorData.id} 
                                            onClick={() => setSelectedMentor({ ...mentorInfo, ...mentorData })}
                                            className="mentor-card relative group bg-slate-50 rounded-2xl overflow-hidden shadow hover:shadow-xl transition-all hover:-translate-y-2 cursor-pointer border border-slate-100"
                                        >
                                            <div className="h-80 overflow-hidden bg-slate-200">
                                                <img 
                                                    src={mentorData.image || mentorData.fallbackImage} 
                                                    onError={(e) => { e.target.onerror = null; e.target.src = mentorData.fallbackImage; }}
                                                    alt={mentorInfo.name} 
                                                    className="w-full h-full object-cover transition-transform duration-700 mentor-image object-top" 
                                                />
                                            </div>
                                            
                                            <div className="absolute inset-0 bg-black/0 group-hover:bg-black/20 transition-all flex items-center justify-center">
                                                <span className="opacity-0 group-hover:opacity-100 bg-white/95 px-6 py-2 rounded-full text-sm font-bold text-slate-800 shadow-lg transform translate-y-4 group-hover:translate-y-0 transition-all duration-300">View Profile</span>
                                            </div>

                                            <div className="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-slate-900 via-slate-900/80 to-transparent p-6 pt-20">
                                                <h3 className="text-xl font-bold text-white mb-1">{mentorInfo.name}</h3>
                                                <p className="text-amber-400 font-medium text-sm uppercase tracking-wider">{mentorInfo.role}</p>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </section>

                    <section id="contact" className="py-24 bg-slate-50 border-t border-slate-100">
                        <div className="container mx-auto px-4 grid lg:grid-cols-2 gap-12">
                            <div>
                                <SectionTitle title={t.contact.title} subtitle={t.contact.subtitle} centered={false} />
                                <div className="space-y-6 mt-8">
                                    <div className="flex gap-4 items-center p-6 bg-white rounded-xl shadow-sm border border-slate-100"><MapPin className="text-amber-500"/><div><h4 className="font-bold">Vizag Center</h4><p className="text-slate-500">Main Campus, Andhra Pradesh</p></div></div>
                                    <div className="flex gap-4 items-center p-6 bg-white rounded-xl shadow-sm border border-slate-100"><Phone className="text-amber-500"/><div><h4 className="font-bold">Phone</h4><p className="text-slate-500">+91 8008117037</p></div></div>
                                    <div className="flex gap-4 items-center p-6 bg-white rounded-xl shadow-sm border border-slate-100"><Mail className="text-amber-500"/><div><h4 className="font-bold">Email</h4><p className="text-slate-500">slakshmipyramid@gmail.com</p></div></div>
                                </div>
                            </div>
                            <div className="h-full"><CustomForm type="contact" formLabels={t.formLabels || TRANSLATIONS.en.formLabels} /></div>
                        </div>
                    </section>

                    <footer className="bg-slate-900 text-slate-400 py-12 text-center border-t border-slate-800">
                        <p>© 2026 Divine Parenting Academy. All rights reserved.</p>
                        <p className="text-xs mt-2 text-slate-600">Please replace image placeholders with actual hosted image URLs in the source code.</p>
                    </footer>

                    <EventDetailsModal event={selectedEventDetails} onClose={() => setSelectedEventDetails(null)} onRegister={setRegistrationEvent} t={t.events} />
                    <EventGalleryModal galleries={EVENT_GALLERIES} selectedIndex={selectedGalleryIndex} onClose={() => setSelectedGalleryIndex(null)} onSelectGallery={setSelectedGalleryIndex} t={t.eventGallery || TRANSLATIONS.en.eventGallery} />
                    <MentorModal mentor={selectedMentor} onClose={() => setSelectedMentor(null)} />
                    <VideoModal videoId={selectedVideo} onClose={() => setSelectedVideo(null)} />
                    <CustomForm type="register" isOpen={!!registrationEvent} prefillData={registrationEvent || {}} onClose={() => setRegistrationEvent(null)} formLabels={t.formLabels || TRANSLATIONS.en.formLabels} />
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
